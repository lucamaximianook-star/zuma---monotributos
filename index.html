<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuma — Monitor Monotributistas</title>
<!-- v4 -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --marino:#0E1A2C;--marino2:#132338;--marino3:#1a2d44;
  --celeste:#3E8CFF;--cielo:#A0C8F3;--celeste2:#2563EB;
  --graffito:#5A6472;--gris:#F1F4F8;--gris2:#E4E9F0;--gris3:#CDD4DF;
  --ok:#16A34A;--ok-bg:#F0FDF4;--ok-border:#BBF7D0;
  --al:#D97706;--al-bg:#FFFBEB;--al-border:#FDE68A;
  --ro:#DC2626;--ro-bg:#FEF2F2;--ro-border:#FECACA;
  --inc:#7C3AED;--inc-bg:#F5F3FF;--inc-border:#DDD6FE;
  --nd:#94A3B8;--nd-bg:#F8FAFC;--nd-border:#E2E8F0;
  --white:#FFFFFF;--text:#1E293B;--text2:#475569;--text3:#94A3B8;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --shadow-lg:0 20px 40px rgba(0,0,0,.15),0 8px 16px rgba(0,0,0,.1);
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --ease:0.2s cubic-bezier(0.4,0,0.2,1);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:#EEF2F7;color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}

/* LOADING */
.ls{position:fixed;inset:0;background:var(--marino);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s ease,visibility .6s}
.ls.out{opacity:0;visibility:hidden;pointer-events:none}
.ls-logo{margin-bottom:32px;text-align:center}
.ls-mark{width:56px;height:56px;background:linear-gradient(135deg,var(--celeste),#60A5FA);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;margin:0 auto 14px;animation:zpulse 2s ease-in-out infinite}
.ls-name{color:#fff;font-size:22px;font-weight:300;letter-spacing:4px}
@keyframes zpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(62,140,255,.4)}50%{transform:scale(1.04);box-shadow:0 0 0 14px rgba(62,140,255,0)}}
.ls-bw{width:220px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.ls-b{height:2px;background:linear-gradient(90deg,var(--celeste),var(--cielo));border-radius:2px;width:0;transition:width .4s ease}
.ls-t{color:rgba(255,255,255,.35);font-size:11px;margin-top:10px;letter-spacing:.5px;font-family:'DM Mono',monospace}

/* NAVBAR */
.nav{background:var(--marino);height:62px;display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(0,0,0,.25)}
.nav::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(62,140,255,.5) 50%,transparent 95%)}
.nav-l{display:flex;align-items:center;gap:12px;flex:1}
.nav-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--celeste),#60A5FA);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(62,140,255,.4)}
.nav-brand{color:#fff;font-size:17px;font-weight:300;letter-spacing:3px}
.nav-sep{width:1px;height:22px;background:rgba(255,255,255,.12);margin:0 4px}
.nav-mod{color:rgba(255,255,255,.4);font-size:12px}
.nav-r{display:flex;align-items:center;gap:14px}
.nav-upd{text-align:right}
.nav-upd-l{color:rgba(255,255,255,.25);font-size:9px;letter-spacing:.6px;text-transform:uppercase;font-family:'DM Mono',monospace}
.nav-upd-v{color:var(--cielo);font-size:11px;margin-top:2px;font-family:'DM Mono',monospace}
.nav-refresh{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.55);padding:7px 16px;border-radius:7px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:var(--ease);letter-spacing:.3px}
.nav-refresh:hover{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.22)}

/* HERO */
.hero{background:var(--marino2);padding:18px 28px;border-bottom:1px solid rgba(255,255,255,.04)}
.hero-inner{max-width:1440px;margin:0 auto;display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.hero-stat{flex:1;min-width:110px;padding:14px 20px;cursor:default;position:relative;transition:var(--ease)}
.hero-stat+.hero-stat{border-left:1px solid rgba(255,255,255,.06)}
.hero-stat:hover{background:rgba(255,255,255,.03)}
.hs-n{font-size:32px;font-weight:700;line-height:1;color:#fff;font-family:'DM Mono',monospace;letter-spacing:-1px}
.hs-l{font-size:10px;color:rgba(255,255,255,.3);margin-top:5px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.hero-stat.ok .hs-n{color:#4ADE80}
.hero-stat.al .hs-n{color:#FCD34D}
.hero-stat.ro .hs-n{color:#F87171}
.hero-right{margin-left:auto;padding:14px 0 14px 20px;border-left:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;justify-content:center;min-width:140px}
.hr-lbl{color:rgba(255,255,255,.3);font-size:9px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.hr-val{color:var(--cielo);font-size:13px;font-weight:500;font-family:'DM Mono',monospace}

/* TOOLBAR */
.tb-wrap{background:var(--white);border-bottom:1px solid var(--gris2);padding:12px 28px;box-shadow:var(--shadow-sm)}
.tb-inner{max-width:1440px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tf-g{display:flex;align-items:center;gap:6px}
.tf-g label{color:var(--text3);font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.tb-wrap select,.tb-wrap input{border:1.5px solid var(--gris2);border-radius:7px;color:var(--text);font-size:12px;padding:7px 11px;font-family:'DM Sans',sans-serif;background:var(--gris);outline:none;transition:var(--ease)}
.tb-wrap select:focus,.tb-wrap input:focus{border-color:var(--celeste);background:#fff;box-shadow:0 0 0 3px rgba(62,140,255,.1)}
.tb-wrap input::placeholder{color:var(--text3)}
.tb-cnt{margin-left:auto;color:var(--text3);font-size:11px;font-family:'DM Mono',monospace}

/* MAIN */
.main{max-width:1440px;margin:20px auto;padding:0 28px 40px}

/* TABLE CARD */
.tc{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--gris2);overflow:hidden}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:var(--gris)}
thead tr{border-bottom:1.5px solid var(--gris2)}
th{padding:11px 16px;text-align:left;font-weight:600;font-size:10px;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;cursor:pointer;white-space:nowrap;user-select:none;transition:var(--ease)}
th:hover{color:var(--text2)}
th.asc::after{content:' ↑';color:var(--celeste)}
th.desc::after{content:' ↓';color:var(--celeste)}
tbody tr{border-bottom:1px solid var(--gris);transition:background var(--ease);cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover td{background:#F6F9FF}
tbody tr.sel td{background:#EEF4FF}
td{padding:13px 16px;vertical-align:middle}
.no-r{padding:60px;text-align:center;color:var(--text3)}

/* Table cells */
.cname{font-weight:600;font-size:13px;color:var(--text)}
.csub{font-size:11px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace}
.pi{display:flex;align-items:center;gap:6px;margin-top:5px}
.pt{flex:1;max-width:90px;height:3px;background:var(--gris2);border-radius:2px;overflow:hidden}
.pf{height:3px;border-radius:2px;transition:width .4s ease}
.pl{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;flex-shrink:0}

/* Badges */
.b{display:inline-flex;align-items:center;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:600;letter-spacing:.3px;white-space:nowrap;line-height:1.4}
.b-g{background:#EEF4FF;color:var(--celeste2);border:1px solid #BFDBFE}
.b-cat{background:var(--marino);color:#fff;font-size:11px;min-width:26px;justify-content:center;font-family:'DM Mono',monospace;padding:3px 7px}
.b-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
.b-al{background:var(--al-bg);color:var(--al);border:1px solid var(--al-border)}
.b-ro{background:var(--ro-bg);color:var(--ro);border:1px solid var(--ro-border)}
.b-inc{background:var(--inc-bg);color:var(--inc);border:1px solid var(--inc-border)}
.b-nd3{background:var(--nd-bg);color:var(--nd);border:1px solid var(--nd-border)}

.am{font-weight:600;font-size:13px;font-family:'DM Mono',monospace;text-align:right}
.pc{font-weight:700;font-size:12px;font-family:'DM Mono',monospace;text-align:right}
.dbtn{padding:6px 13px;font-size:11px;border:1.5px solid var(--gris2);border-radius:6px;background:var(--white);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:var(--ease)}
.dbtn:hover{border-color:var(--celeste);color:var(--celeste);background:#F0F6FF}

/* OVERLAY */
.ov{position:fixed;inset:0;background:rgba(10,18,30,.5);z-index:500;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s;backdrop-filter:blur(3px)}
.ov.on{opacity:1;visibility:visible}

/* SLIDE PANEL */
.sp{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--white);z-index:501;transform:translateX(105%);transition:transform .38s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:-24px 0 80px rgba(0,0,0,.18)}
.sp.on{transform:translateX(0)}
.sph{background:var(--marino);padding:22px 24px;flex-shrink:0;position:relative}
.sph::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(62,140,255,.4),transparent)}
.sph-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sph-name{color:#fff;font-size:19px;font-weight:600;line-height:1.2;flex:1}
.sph-x{width:34px;height:34px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:rgba(255,255,255,.6);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--ease)}
.sph-x:hover{background:rgba(255,255,255,.18);color:#fff}
.sph-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.sph-tag{padding:3px 9px;border-radius:5px;font-size:10px;font-weight:500;background:rgba(255,255,255,.08);color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.1)}
.sph-prog{display:flex;align-items:center;gap:10px}
.sph-sem{flex-shrink:0}
.sph-pct{color:rgba(255,255,255,.55);font-size:12px;font-family:'DM Mono',monospace;flex-shrink:0}
.sph-bar{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.sph-fill{height:5px;border-radius:3px;transition:width .7s ease .1s}

/* Panel body */
.spb{flex:1;overflow-y:auto;padding:0}
.spb::-webkit-scrollbar{width:4px}
.spb::-webkit-scrollbar-thumb{background:var(--gris2);border-radius:2px}
.sps{padding:20px 24px;border-bottom:1px solid var(--gris)}
.sps:last-child{border-bottom:none}
.sec-t{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:'';flex:1;height:1px;background:var(--gris2)}

/* KPI grid */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kc{background:var(--gris);border-radius:var(--radius-sm);padding:14px;border:1px solid transparent}
.kc.dark{background:var(--marino)}
.kc.acc{background:#EEF4FF;border-color:#BFDBFE}
.kl{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.kc.dark .kl{color:rgba(160,200,243,.6)}
.kv{font-size:20px;font-weight:700;color:var(--text);font-family:'DM Mono',monospace;line-height:1}
.kc.dark .kv{color:#fff;font-size:22px}
.kc.acc .kv{color:var(--celeste2)}
.ks{font-size:10px;color:var(--text3);margin-top:4px}
.kc.dark .ks{color:rgba(255,255,255,.3)}

/* Progress */
.pr{margin:8px 0}
.prh{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.prh span{font-size:11px;color:var(--text3)}
.prh strong{font-size:11px;color:var(--text);font-family:'DM Mono',monospace}
.prb{height:8px;background:var(--gris2);border-radius:4px;overflow:hidden}
.prf{height:8px;border-radius:4px;transition:width .6s ease .2s}

/* Alert */
.al-box{padding:10px 13px;border-radius:7px;font-size:11px;margin:10px 0;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.al-box.inc{background:var(--inc-bg);border:1px solid var(--inc-border);color:var(--inc)}
.al-box.ro{background:var(--ro-bg);border:1px solid var(--ro-border);color:var(--ro)}

/* Cuota cards */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{border:1.5px solid var(--gris2);border-radius:var(--radius-sm);padding:14px}
.cc.nx{border-color:#93C5FD;background:linear-gradient(160deg,#F0F6FF,#EBF3FF)}
.cc.crit{border-color:var(--ro-border);background:var(--ro-bg)}
.cc-tit{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.cc-cat{font-size:28px;font-weight:700;color:var(--text);font-family:'DM Mono',monospace;margin-bottom:6px}
.cc.nx .cc-cat{color:var(--celeste2)}
.cc.crit .cc-cat{color:var(--ro)}
.ccl{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--gris);font-size:11px}
.ccl:last-of-type{border-bottom:none}
.ccn{color:var(--text3)}
.cca{font-weight:500;color:var(--text);font-family:'DM Mono',monospace}
.cc-sub{display:flex;justify-content:space-between;padding:6px 8px;background:var(--gris);border-radius:5px;margin-top:8px;font-size:11px}
.cc-tot{background:var(--marino);border-radius:7px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.cc-tot .ccn{color:rgba(255,255,255,.55);font-size:11px;font-weight:600}
.cc-tot .cca{color:#fff;font-size:15px;font-weight:700}
.cc-diff{margin-top:8px;text-align:center;font-size:10px;color:var(--celeste2);font-weight:600}

/* Month chart */
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mc{border-radius:7px;padding:8px 4px;text-align:center;transition:transform var(--ease)}
.mc:hover{transform:translateY(-2px)}
.mc.ok-m{background:var(--ok-bg);border:1px solid var(--ok-border)}
.mc.z-m{background:var(--gris);border:1px solid transparent}
.mc.ms-m{background:var(--inc-bg);border:1px solid var(--inc-border)}
.mc.ft-m{background:var(--gris);border:1px dashed var(--gris3);opacity:.45}
.mc-l{font-size:9px;color:var(--text3);font-weight:600;margin-bottom:4px;letter-spacing:.3px}
.mc-bw{height:32px;display:flex;align-items:flex-end;justify-content:center;margin:3px 0}
.mc-bar{width:100%;border-radius:3px;min-height:2px}
.mc-v{font-size:10px;font-weight:600;color:var(--text);font-family:'DM Mono',monospace}
.mc.z-m .mc-v{color:var(--text3)}
.mc.ms-m .mc-v{color:var(--inc)}

/* Panel footer */
.spf{padding:16px 24px;border-top:1px solid var(--gris2);display:flex;gap:8px;flex-shrink:0}
.btn-p{flex:1;padding:11px;font-size:12px;background:var(--marino);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:var(--ease)}
.btn-p:hover{background:var(--marino3)}
.btn-s{padding:11px 16px;font-size:12px;background:var(--gris);color:var(--text2);border:1.5px solid var(--gris2);border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:var(--ease)}
.btn-s:hover{background:var(--gris2)}

.err-b{background:var(--ro-bg);border-bottom:1.5px solid var(--ro-border);padding:10px 28px;color:var(--ro);font-size:12px;display:none;font-weight:500}

@media(max-width:900px){
  .nav,.hero,.tb-wrap,.main,.err-b{padding-left:16px;padding-right:16px}
  .main{padding-left:12px;padding-right:12px}
  .kgrid{grid-template-columns:1fr 1fr}
  .cgrid{grid-template-columns:1fr}
  .mgrid{grid-template-columns:repeat(4,1fr)}
  .sp{width:100vw}
  th:nth-child(3),td:nth-child(3){display:none}
}
@media(max-width:600px){
  .mgrid{grid-template-columns:repeat(3,1fr)}
  .kgrid{grid-template-columns:1fr}
  th:nth-child(4),td:nth-child(4){display:none}
}
@media print{
  .nav,.hero,.tb-wrap,.main,.ov,.err-b{display:none!important}
  .sp{position:static;width:100%;transform:none;box-shadow:none;display:flex!important}
  .sph{background:#0E1A2C!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="ls" id="ls">
  <div class="ls-logo">
    <div class="ls-mark">Z</div>
    <div class="ls-name">zuma</div>
  </div>
  <div class="ls-bw"><div class="ls-b" id="lbar"></div></div>
  <div class="ls-t" id="ltxt">Iniciando...</div>
</div>

<div class="err-b" id="err"></div>

<nav class="nav">
  <div class="nav-l">
    <div class="nav-mark">Z</div>
    <span class="nav-brand">zuma</span>
    <div class="nav-sep"></div>
    <span class="nav-mod">Monitor Monotributistas</span>
  </div>
  <div class="nav-r">
    <div class="nav-upd">
      <div class="nav-upd-l">Actualizado</div>
      <div class="nav-upd-v" id="lupd">—</div>
    </div>
    <button class="nav-refresh" onclick="loadAll()">↻ Actualizar</button>
  </div>
</nav>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-stat">
      <div class="hs-n" id="st">—</div>
      <div class="hs-l">Clientes activos</div>
    </div>
    <div class="hero-stat ok">
      <div class="hs-n" id="so">—</div>
      <div class="hs-l">OK — bajo 50%</div>
    </div>
    <div class="hero-stat al">
      <div class="hs-n" id="sa">—</div>
      <div class="hs-l">Alerta — 50–80%</div>
    </div>
    <div class="hero-stat ro">
      <div class="hs-n" id="sr">—</div>
      <div class="hs-l">Rojo — sobre 80%</div>
    </div>
    <div class="hero-right">
      <div class="hr-lbl">Ciclo activo</div>
      <div class="hr-val" id="ciclo-val">Jul-25 → Jun-26</div>
    </div>
  </div>
</div>

<div class="tb-wrap">
  <div class="tb-inner">
    <div class="tf-g"><label>Grupo</label>
      <select id="fg" onchange="render()"><option value="">Todos</option></select></div>
    <div class="tf-g"><label>Ciclo</label>
      <select id="fc" onchange="onCC()">
        <option value="c1">Ciclo 1 — Ene/Dic 2025</option>
        <option value="c2" selected>Ciclo 2 — Jul 25/Jun 26</option>
      </select></div>
    <div class="tf-g"><label>Estado</label>
      <select id="fs" onchange="render()">
        <option value="">Todos</option>
        <option value="ok">OK</option>
        <option value="al">Alerta</option>
        <option value="ro">Rojo</option>
        <option value="inc">Incompleto</option>
        <option value="nd3">Sin datos</option>
      </select></div>
    <div class="tf-g">
      <input type="text" id="fq" placeholder="Buscar cliente..." oninput="render()" style="min-width:180px"></div>
    <span class="tb-cnt" id="tcnt"></span>
  </div>
</div>

<div class="main">
  <div class="tc">
    <div class="tw">
      <table>
        <thead><tr>
          <th id="thn" onclick="sortBy('n')">Cliente</th>
          <th id="thg" onclick="sortBy('g')">Grupo</th>
          <th id="thc" onclick="sortBy('c')" style="text-align:center">Cat.</th>
          <th id="tht" onclick="sortBy('t')" style="text-align:right">Total <span id="thlbl">Jul–Jun</span></th>
          <th id="thp" onclick="sortBy('p')" style="text-align:right">% Tope K</th>
          <th>Estado</th>
          <th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="ov" id="ov" onclick="closeP()"></div>
<div class="sp" id="sp">
  <div class="sph" id="sph"></div>
  <div class="spb" id="spb"></div>
  <div class="spf" id="spf"></div>
</div>

<script>
const PUB='2PACX-1vTImQOlHnK1PHaxRg8oXD7pBwmDHrOEGmK54dhWj5PF9KNTSqFViwTz1ncKBoLSkjx36vXQj94rbrwK';
const GIDS={TOPES:'2112531242',IIBB:'1006339578',CICLO1:'234483374',CICLO2:'1539371977',CLIENTES:'1819856991'};
const M1=['Ene-25','Feb-25','Mar-25','Abr-25','May-25','Jun-25','Jul-25','Ago-25','Sep-25','Oct-25','Nov-25','Dic-25'];
const M2=['Jul-25','Ago-25','Sep-25','Oct-25','Nov-25','Dic-25','Ene-26','Feb-26','Mar-26','Abr-26','May-26','Jun-26'];
const PAST_C1=12,PAST_C2=9;
let CATS=[],IC=[],IAS=[],IAB=[],CL=[],C1={},C2={},TK=108357084.05;
let sc='t',sd=-1,sel=null;

function csvU(g){return`https://docs.google.com/spreadsheets/d/e/${PUB}/pub?gid=${g}&single=true&output=csv`;}
function parseCSV(t){
  const rows=[];const lines=t.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  for(const l of lines){if(!l.trim())continue;const cells=[];let cur='',inQ=false;
    for(let i=0;i<l.length;i++){if(l[i]==='"'){if(inQ&&l[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(l[i]===','&&!inQ){cells.push(cur.trim());cur='';}else cur+=l[i];}
    cells.push(cur.trim());rows.push(cells);}return rows;
}
function n(v){
  v=String(v||'').trim().replace(/^"|"$/g,'');
  if(!v||v==='-'||v.toUpperCase()==='NAN'||v==='#N/A')return 0;
  v=v.replace(/\$/g,'').replace(/\s/g,'').replace(/%/g,'');
  if(/^\d{1,3}(\.\d{3})+,\d+$/.test(v))return parseFloat(v.replace(/\./g,'').replace(',','.'));
  if(/^\d+,\d+$/.test(v))return parseFloat(v.replace(',','.'));
  if(/^\d+(\.\d+)?$/.test(v))return parseFloat(v);
  if(/^\d{1,3}(\.\d{3})+$/.test(v))return parseFloat(v.replace(/\./g,''));
  const x=parseFloat(v.replace(/\./g,'').replace(',','.'));return isNaN(x)?0:x;
}
function emp(v){v=String(v||'').trim().replace(/^"|"$/g,'');return!v||v===''||v==='nan';}
function cl(v){return String(v||'').trim().replace(/^"|"$/g,'');}
async function fcsv(g){const r=await fetch(csvU(g));if(!r.ok)throw new Error('HTTP '+r.status);return parseCSV(await r.text());}

async function loadT(){
  const rows=await fcsv(GIDS.TOPES);CATS=[];
  for(const r of rows){const c=cl(r[0]);if(!'ABCDEFGHIJK'.includes(c)||c.length!==1)continue;
    CATS.push({c,t:n(r[1]),is:n(r[4]),ib:n(r[5]),j:n(r[6]),os:n(r[7]),tis:n(r[8]),tib:n(r[9]),tds:n(r[10]),tdb:n(r[11])});}
  if(CATS.length)TK=CATS[CATS.length-1].t;
}
async function loadI(){
  const rows=await fcsv(GIDS.IIBB);IC=[];IAS=[];IAB=[];let sec='';
  for(const r of rows){const f=cl(r[0]).toUpperCase();
    if(f.includes('AGIP')){sec='C';continue;}if(f.includes('ARBA')){sec='A';continue;}
    const c=cl(r[0]);if(!'ABCDEFGHIJK'.includes(c)||c.length!==1)continue;
    if(sec==='C')IC.push(n(r[2]));if(sec==='A'){IAS.push(n(r[2]));IAB.push(n(r[3]));}}
}
async function loadC(g){
  const rows=await fcsv(g);const d={};let hi=-1;
  for(let i=0;i<rows.length;i++){for(let j=0;j<rows[i].length;j++){if(cl(rows[i][j]).toUpperCase()==='CLIENTE'){hi=i;break;}}if(hi>-1)break;}
  if(hi===-1)return d;
  const hdr=rows[hi].map(h=>cl(h).toUpperCase());const iN=hdr.indexOf('CLIENTE');
  let iS=-1;for(let j=0;j<hdr.length;j++){if(/^(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)/.test(hdr[j])){iS=j;break;}}
  if(iN===-1||iS===-1)return d;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];const nm=cl(r[iN]);if(!nm||nm.toUpperCase()==='CLIENTE')continue;
    const m=[],ms=[];
    for(let j=iS;j<iS+12;j++){const raw=j<r.length?r[j]:'';ms.push(emp(raw));m.push(n(raw));}
    while(m.length<12){m.push(0);ms.push(true);}d[nm]={months:m,missing:ms};}
  return d;
}
async function loadCL(){
  const rows=await fcsv(GIDS.CLIENTES);CL=[];let hi=-1;
  for(let i=0;i<rows.length;i++){for(let j=0;j<rows[i].length;j++){if(cl(rows[i][j]).toUpperCase()==='NOMBRE'){hi=i;break;}}if(hi>-1)break;}
  if(hi===-1)return;
  const h=rows[hi].map(x=>cl(x).toUpperCase());
  const iN=h.indexOf('NOMBRE'),iG=h.indexOf('GRUPO'),iA=h.indexOf('ACTIVIDAD');
  const iSL=h.indexOf('SITUACION LABORAL'),iI=h.indexOf('REGIMEN IIBB'),iE=h.indexOf('ESTADO');
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];const nm=cl(r[iN>-1?iN:1]);if(!nm||nm.toUpperCase()==='NOMBRE')continue;
    if(cl(r[iE>-1?iE:14]).toUpperCase()==='BAJA')continue;
    CL.push({n:nm,g:cl(r[iG>-1?iG:2])||'INDIVIDUAL',a:cl(r[iA>-1?iA:5])||'Servicios',sl:cl(r[iSL>-1?iSL:6])||'Independiente',iibb:cl(r[iI>-1?iI:7])||'Exento'});}
}

async function loadAll(){
  const btn=document.querySelector('.nav-refresh');if(btn)btn.textContent='↻';
  sL(true);
  try{
    prog(10,'Cargando escalas...');await loadT();
    prog(30,'Cargando IIBB...');await loadI();
    prog(50,'Cargando Ciclo 1...');C1=await loadC(GIDS.CICLO1);
    prog(70,'Cargando Ciclo 2...');C2=await loadC(GIDS.CICLO2);
    prog(85,'Cargando clientes...');await loadCL();
    prog(100,'Listo ✓');
    CL.forEach(c=>{
      const d1=C1[c.n]||{months:new Array(12).fill(0),missing:new Array(12).fill(true)};
      const d2=C2[c.n]||{months:new Array(12).fill(0),missing:new Array(12).fill(true)};
      c.c1=d1.months;c.m1=d1.missing;c.c2=d2.months;c.m2=d2.missing;});
    const s=document.getElementById('fg');const ex=[...s.options].map(o=>o.value);
    [...new Set(CL.map(c=>c.g))].sort().forEach(g=>{if(!ex.includes(g)){const o=document.createElement('option');o.value=g;o.textContent=g;s.appendChild(o);}});
    const now=new Date();
    document.getElementById('lupd').textContent=now.toLocaleDateString('es-AR')+' '+now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+' · K: $'+fmtk(TK);
    hideE();render();setTimeout(()=>sL(false),500);
  }catch(e){showE('Error: '+e.message);sL(false);}
  if(btn)btn.textContent='↻ Actualizar';
}

function sL(v){const e=document.getElementById('ls');if(v)e.classList.remove('out');else e.classList.add('out');}
function prog(p,t){document.getElementById('lbar').style.width=p+'%';document.getElementById('ltxt').textContent=t;}
function showE(m){const e=document.getElementById('err');e.textContent=m;e.style.display='block';}
function hideE(){document.getElementById('err').style.display='none';}

function onCC(){
  const ci=document.getElementById('fc').value;
  document.getElementById('ciclo-val').textContent=ci==='c1'?'Ene-25 → Dic-25':'Jul-25 → Jun-26';
  document.getElementById('thlbl').textContent=ci==='c1'?'Ene–Dic':'Jul–Jun';
  render();
}

function gCi(t){for(let i=0;i<CATS.length;i++)if(t<=CATS[i].t)return i;return CATS.length-1;}
function gS(p,inc){
  if(inc)return{k:'inc',l:'Incompleto'};if(p===0)return{k:'nd3',l:'Sin datos'};
  if(p>=0.8)return{k:'ro',l:'Rojo'};if(p>=0.5)return{k:'al',l:'Alerta'};return{k:'ok',l:'OK'};
}
function fmt(v){return Math.round(v).toLocaleString('es-AR');}
function fmtk(v){if(v>=1000000)return(v/1000000).toFixed(1)+'M';if(v>=1000)return(v/1000).toFixed(0)+'k';return Math.round(v).toString();}
function fmtp(p){return(p*100).toFixed(1)+'%';}
function sCol(k){return k==='ro'?'#DC2626':k==='al'?'#D97706':k==='ok'?'#16A34A':k==='inc'?'#7C3AED':'#94A3B8';}
function gInc(arr,miss,ci){const p=ci==='c1'?PAST_C1:PAST_C2;for(let i=0;i<p;i++)if(miss[i])return true;return false;}
function gIIBB(c,ci){
  if(c.iibb==='Exento')return 0;if(c.iibb.includes('Convenio'))return null;
  if(c.iibb.includes('CABA'))return IC[ci]||0;
  if(c.iibb.includes('BsAs')||c.iibb.includes('Buenos'))return c.a==='Venta de Bienes'?(IAB[ci]||0):(IAS[ci]||0);
  return 0;
}
function gCu(c,ci){
  if(!CATS.length)return{imp:0,jub:0,os:0,total:0};
  const cat=CATS[ci],eB=c.a==='Venta de Bienes',eD=c.sl==='Relación de dependencia';
  if(eD)return{imp:eB?cat.ib:cat.is,jub:0,os:0,total:eB?cat.tdb:cat.tds};
  return{imp:eB?cat.ib:cat.is,jub:cat.j,os:cat.os,total:eB?cat.tib:cat.tis};
}

function gFilt(){
  const g=document.getElementById('fg').value,ci=document.getElementById('fc').value;
  const sf=document.getElementById('fs').value,q=document.getElementById('fq').value.toLowerCase();
  return CL.filter(c=>{
    if(g&&c.g!==g)return false;if(q&&!c.n.toLowerCase().includes(q))return false;
    const arr=ci==='c1'?c.c1:c.c2,miss=ci==='c1'?c.m1:c.m2;
    const tot=arr.reduce((a,b)=>a+b,0);
    const s=gS(TK>0?tot/TK:0,gInc(arr,miss,ci));
    if(sf&&s.k!==sf)return false;return true;
  }).map(c=>{
    const ci=document.getElementById('fc').value;
    const arr=ci==='c1'?c.c1:c.c2,miss=ci==='c1'?c.m1:c.m2;
    const tot=arr.reduce((a,b)=>a+b,0),pct=TK>0?tot/TK:0;
    const cIdx=gCi(tot),inc=gInc(arr,miss,ci);
    return{...c,arr,miss,tot,pct,ci:cIdx,inc,s:gS(pct,inc)};
  }).sort((a,b)=>{
    if(sc==='n')return sd*a.n.localeCompare(b.n);if(sc==='g')return sd*a.g.localeCompare(b.g);
    if(sc==='t')return sd*(a.tot-b.tot);if(sc==='p')return sd*(a.pct-b.pct);
    if(sc==='c')return sd*(a.ci-b.ci);return 0;
  });
}

function sortBy(col){
  ['n','g','c','t','p'].forEach(k=>{const e=document.getElementById('th'+k);if(e)e.className='';});
  if(sc===col)sd*=-1;else{sc=col;sd=-1;}
  const e=document.getElementById('th'+col);if(e)e.className=sd===-1?'desc':'asc';render();
}

function render(){
  const data=gFilt();
  document.getElementById('st').textContent=data.length;
  document.getElementById('so').textContent=data.filter(d=>d.s.k==='ok').length;
  document.getElementById('sa').textContent=data.filter(d=>d.s.k==='al').length;
  document.getElementById('sr').textContent=data.filter(d=>d.s.k==='ro').length;
  document.getElementById('tcnt').textContent=data.length+' clientes';
  const tbody=document.getElementById('tbody');
  if(!data.length){tbody.innerHTML=`<tr><td colspan="7" class="no-r">No hay clientes que coincidan.</td></tr>`;return;}
  tbody.innerHTML=data.map(d=>{
    const cL=CATS.length?CATS[d.ci].c:'—',sc2=sCol(d.s.k);
    const isS=sel===d.n?'sel':'';
    return`<tr class="${isS}" onclick="openP('${d.n.replace(/'/g,"\\'")}')">
      <td><div class="cname">${d.n}</div>
        <div class="pi"><div class="pt"><div class="pf" style="width:${Math.min(d.pct*100,100).toFixed(1)}%;background:${sc2}"></div></div>
        <span class="pl">${fmtp(d.pct)}</span></div></td>
      <td><span class="b b-g">${d.g}</span></td>
      <td style="text-align:center"><span class="b b-cat">${cL}</span></td>
      <td class="am">$${fmt(d.tot)}</td>
      <td class="pc" style="color:${sc2}">${fmtp(d.pct)}</td>
      <td><span class="b b-${d.s.k}">${d.s.l}</span></td>
      <td><button class="dbtn" onclick="event.stopPropagation();openP('${d.n.replace(/'/g,"\\'")}')">Ver →</button></td>
    </tr>`;
  }).join('');
}

function openP(nombre){
  sel=nombre;
  document.querySelectorAll('tbody tr').forEach(r=>r.classList.remove('sel'));
  [...document.querySelectorAll('tbody tr')].find(r=>r.querySelector('.cname')?.textContent===nombre)?.classList.add('sel');
  buildP(nombre);
  document.getElementById('ov').classList.add('on');
  document.getElementById('sp').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeP(){
  sel=null;
  document.getElementById('ov').classList.remove('on');
  document.getElementById('sp').classList.remove('on');
  document.body.style.overflow='';
  document.querySelectorAll('tbody tr').forEach(r=>r.classList.remove('sel'));
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeP();});

function buildP(nombre){
  const ci=document.getElementById('fc').value,meses=ci==='c1'?M1:M2,pc=ci==='c1'?PAST_C1:PAST_C2;
  const c=CL.find(x=>x.n===nombre);if(!c||!CATS.length)return;
  const arr=ci==='c1'?c.c1:c.c2,miss=ci==='c1'?c.m1:c.m2;
  const tot=arr.reduce((a,b)=>a+b,0),pct=TK>0?tot/TK:0;
  const ci2=gCi(tot),cat=CATS[ci2],nx=ci2<CATS.length-1?CATS[ci2+1]:null;
  const inc=gInc(arr,miss,ci),s=gS(pct,inc),sc2=sCol(s.k);
  const maxV=Math.max(...arr,1),fCat=nx?nx.t-tot:0,fMax=TK-tot,pCat=nx?tot/nx.t:1;
  const cu=gCu(c,ci2),cuN=nx?gCu(c,ci2+1):null;
  const ib=gIIBB(c,ci2),ibN=nx?gIIBB(c,ci2+1):null;
  const totM=cu.total+(ib===null?0:ib),totNM=cuN?(cuN.total+(ibN===null?0:(ibN||0))):null;
  const eI=c.sl==='Independiente';

  // Header
  document.getElementById('sph').innerHTML=`
    <div class="sph-top">
      <div class="sph-name">${c.n}</div>
      <button class="sph-x" onclick="closeP()">✕</button>
    </div>
    <div class="sph-tags">
      <span class="sph-tag">${c.g}</span><span class="sph-tag">${c.a}</span>
      <span class="sph-tag">${c.sl}</span><span class="sph-tag">${c.iibb}</span>
      <span class="sph-tag">Cat. ${cat.c}</span>
    </div>
    <div class="sph-prog">
      <span class="b b-${s.k} sph-sem">${s.l}</span>
      <span class="sph-pct">${fmtp(pct)} del tope K</span>
      <div class="sph-bar"><div class="sph-fill" style="width:${Math.min(pct*100,100).toFixed(1)}%;background:${sc2}"></div></div>
    </div>`;

  // Month bars
  const mCells=arr.map((v,i)=>{
    const isPast=i<pc,isMiss=miss[i];
    let cls='mc ';
    if(isMiss&&isPast)cls+='ms-m';else if(!isPast)cls+='ft-m';else if(v===0)cls+='z-m';else cls+='ok-m';
    const bH=v>0?Math.round(v/maxV*28):0;
    const vs=v>0?'$'+fmtk(v):isMiss&&isPast?'⚠':'—';
    return`<div class="${cls}"><div class="mc-l">${meses[i]}</div><div class="mc-bw"><div class="mc-bar" style="height:${bH}px;background:${v>0?sc2:'var(--gris2)'}"></div></div><div class="mc-v">${vs}</div></div>`;
  }).join('');

  document.getElementById('spb').innerHTML=`
    <div class="sps">
      <div class="sec-t">Resumen del ciclo</div>
      <div class="kgrid">
        <div class="kc dark"><div class="kl">Facturación ${ci==='c1'?'Ene–Dic 25':'Jul 25–Jun 26'}</div><div class="kv">$${fmtk(tot)}</div><div class="ks">$${fmt(tot)}</div></div>
        <div class="kc"><div class="kl">Categoría actual</div><div class="kv">${cat.c}</div><div class="ks">Tope: $${fmtk(cat.t)}</div></div>
        <div class="kc"><div class="kl">Falta para cat. siguiente</div><div class="kv" style="color:${nx&&fCat>0?'var(--text)':'var(--ro)'}">${nx?'$'+fmtk(fCat):'Máximo'}</div><div class="ks">${nx?'Cat. '+nx.c:''}</div></div>
        <div class="kc"><div class="kl">Falta para tope K</div><div class="kv" style="color:${fMax>0?'var(--text)':'var(--ro)'}">${fMax>0?'$'+fmtk(fMax):'Superado'}</div><div class="ks">$${fmtk(TK)}</div></div>
      </div>
    </div>
    <div class="sps">
      <div class="sec-t">Progreso</div>
      <div class="pr"><div class="prh"><span>% del tope Cat. K</span><strong>${fmtp(pct)}</strong></div><div class="prb"><div class="prf" style="width:${Math.min(pct*100,100).toFixed(1)}%;background:${sc2}"></div></div></div>
      ${nx?`<div class="pr"><div class="prh"><span>% hacia cat. siguiente (${nx.c})</span><strong>${fmtp(pCat)}</strong></div><div class="prb"><div class="prf" style="width:${Math.min(pCat*100,100).toFixed(1)}%;background:${sc2}"></div></div></div>`:''}
      ${inc?`<div class="al-box inc"><span>⚠</span><span>Hay meses pasados sin completar. El total puede ser incorrecto.</span></div>`:''}
      ${pct>=0.8?`<div class="al-box ro"><span>🚨</span><span>Categoría en riesgo. Revisar con el cliente y analizar recategorización.</span></div>`:''}
    </div>
    <div class="sps">
      <div class="sec-t">Cuotas mensuales</div>
      <div class="cgrid">
        <div class="cc">
          <div class="cc-tit">Cat. actual — ${cat.c}</div><div class="cc-cat">${cat.c}</div>
          <div class="ccl"><span class="ccn">Imp. integrado</span><span class="cca">$${fmt(cu.imp)}</span></div>
          ${eI?`<div class="ccl"><span class="ccn">Jubilación</span><span class="cca">$${fmt(cu.jub)}</span></div><div class="ccl"><span class="ccn">Obra social</span><span class="cca">$${fmt(cu.os)}</span></div>`:`<div class="ccl"><span class="ccn">Jub. y OS</span><span class="cca" style="color:var(--text3)">Por empleador</span></div>`}
          <div class="cc-sub"><span class="ccn">IIBB</span><span class="cca">${ib===null?'No aplica':ib===0?'Exento':'$'+fmt(ib)}</span></div>
          <div class="cc-tot"><span class="ccn">TOTAL / MES</span><span class="cca">$${fmt(totM)}</span></div>
        </div>
        ${nx?`<div class="cc nx">
          <div class="cc-tit">Si sube a cat. ${nx.c}</div><div class="cc-cat">${nx.c}</div>
          <div class="ccl"><span class="ccn">Imp. integrado</span><span class="cca">$${fmt(cuN.imp)}</span></div>
          ${eI?`<div class="ccl"><span class="ccn">Jubilación</span><span class="cca">$${fmt(cuN.jub)}</span></div><div class="ccl"><span class="ccn">Obra social</span><span class="cca">$${fmt(cuN.os)}</span></div>`:`<div class="ccl"><span class="ccn">Jub. y OS</span><span class="cca" style="color:var(--text3)">Por empleador</span></div>`}
          <div class="cc-sub"><span class="ccn">IIBB</span><span class="cca">${ibN===null?'No aplica':ibN===0?'Exento':'$'+fmt(ibN||0)}</span></div>
          <div class="cc-tot"><span class="ccn">TOTAL / MES</span><span class="cca">$${fmt(totNM)}</span></div>
          <div class="cc-diff">+$${fmt(totNM-totM)}/mes adicionales</div>
        </div>`:`<div class="cc crit"><div class="cc-tit">Situación crítica</div><div class="cc-cat">K</div><p style="font-size:11px;color:var(--ro);line-height:1.6;margin-top:8px">Categoría máxima. Analizar exclusión del régimen.</p></div>`}
      </div>
    </div>
    <div class="sps">
      <div class="sec-t">Facturación mes a mes</div>
      <div class="mgrid">${mCells}</div>
    </div>`;

  document.getElementById('spf').innerHTML=`
    <button class="btn-p" onclick="window.print()">↓ Exportar PDF</button>
    <button class="btn-s">↓ Excel</button>`;
}

onCC();loadAll();
</script>
</body>
</html>
