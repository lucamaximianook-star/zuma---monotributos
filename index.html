<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuma — Monitor Monotributistas</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<!-- v8 -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --marino:#0E1A2C;--marino2:#132338;--marino3:#1a2d44;
  --celeste:#3E8CFF;--cielo:#A0C8F3;--celeste2:#2563EB;
  --graffito:#5A6472;--gris:#F1F4F8;--gris2:#E4E9F0;--gris3:#CDD4DF;
  --ok:#16A34A;--ok-bg:#F0FDF4;--ok-border:#BBF7D0;
  --al:#D97706;--al-bg:#FFFBEB;--al-border:#FDE68A;
  --ro:#DC2626;--ro-bg:#FEF2F2;--ro-border:#FECACA;
  --inc:#7C3AED;--inc-bg:#F5F3FF;--inc-border:#DDD6FE;
  --nd:#94A3B8;--nd-bg:#F8FAFC;--nd-border:#E2E8F0;
  --white:#FFFFFF;--text:#1E293B;--text2:#475569;--text3:#94A3B8;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 12px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 24px 48px rgba(0,0,0,.12),0 12px 24px rgba(0,0,0,.08);
  --radius:14px;--radius-sm:10px;--radius-xs:8px;
  --ease:0.2s cubic-bezier(0.4,0,0.2,1);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:#EEF2F7;color:var(--text);font-size:15px;line-height:1.6;overflow-x:hidden}

/* LOADING */
.ls{position:fixed;inset:0;background:var(--marino);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s var(--ease-out),visibility .4s}
.ls.out{opacity:0;visibility:hidden;pointer-events:none}
.ls-logo{margin-bottom:32px;text-align:center}
.ls-mark{width:56px;height:56px;background:linear-gradient(135deg,var(--celeste),#60A5FA);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;margin:0 auto 14px;animation:zpulse 2s ease-in-out infinite}
.ls-name{color:#fff;font-size:22px;font-weight:300;letter-spacing:4px}
@keyframes zpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(62,140,255,.4)}50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(62,140,255,0)}}
.ls-bw{width:220px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.ls-b{height:2px;background:linear-gradient(90deg,var(--celeste),var(--cielo));border-radius:2px;width:0;transition:width .4s ease}
.ls-t{color:rgba(255,255,255,.35);font-size:11px;margin-top:10px;letter-spacing:.5px;font-family:'DM Mono',monospace}

/* NAVBAR */
.nav{background:var(--marino);height:68px;display:flex;align-items:center;padding:0 32px;position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(0,0,0,.25)}
.nav::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(62,140,255,.5) 50%,transparent 95%)}
.nav-l{display:flex;align-items:center;gap:12px;flex:1}
.nav-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--celeste),#60A5FA);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(62,140,255,.4)}
.nav-brand{color:#fff;font-size:17px;font-weight:300;letter-spacing:3px}
.nav-sep{width:1px;height:22px;background:rgba(255,255,255,.12);margin:0 4px}
.nav-mod{color:rgba(255,255,255,.4);font-size:13px}
.nav-r{display:flex;align-items:center;gap:14px}
.nav-upd{text-align:right}
.nav-upd-l{color:rgba(255,255,255,.25);font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-family:'DM Mono',monospace}
.nav-upd-v{color:var(--cielo);font-size:12px;margin-top:2px;font-family:'DM Mono',monospace}
.nav-refresh{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.55);padding:9px 20px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:transform 160ms var(--ease-out),background .2s var(--ease-out),color .2s var(--ease-out),border-color .2s var(--ease-out);letter-spacing:.3px}
.nav-refresh:hover{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.22)}
.nav-refresh:active{transform:scale(0.97)}

/* HERO */
.hero{background:var(--marino2);padding:24px 32px 28px;border-bottom:1px solid rgba(255,255,255,.04)}
.hero-inner{max-width:1440px;margin:0 auto;display:flex;align-items:stretch;gap:16px;flex-wrap:wrap}
.hero-stat{flex:1;min-width:110px;padding:20px 24px;cursor:default;position:relative;transition:background-color .2s var(--ease-out),border-color .2s var(--ease-out),opacity .4s var(--ease-out),transform .4s var(--ease-out);background:rgba(255,255,255,.04);border-radius:12px;border:1px solid rgba(255,255,255,.06);opacity:0;transform:translateY(10px)}
.hero-stat.entered{opacity:1;transform:translateY(0) scale(1)}
.hero-stat+.hero-stat{border-left:none}
.hs-n{font-size:36px;font-weight:700;line-height:1;color:#fff;font-family:'DM Mono',monospace;letter-spacing:-1px}
.hs-l{font-size:12px;color:rgba(255,255,255,.45);margin-top:8px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.hero-stat.ok{background:rgba(74,222,128,.06);border-color:rgba(74,222,128,.15)}
.hero-stat.ok .hs-n{color:#4ADE80}
.hero-stat.al{background:rgba(252,211,77,.06);border-color:rgba(252,211,77,.15)}
.hero-stat.al .hs-n{color:#FCD34D}
.hero-stat.ro{background:rgba(248,113,113,.06);border-color:rgba(248,113,113,.15)}
.hero-stat.ro .hs-n{color:#F87171}
.hero-stat.rx{background:#FEF2F2;border-color:#FECACA}
.hero-stat.rx .hs-n{color:#DC2626}
.hero-stat.rx .hs-l{color:#991B1B}
.hero-right{margin-left:auto;padding:20px 0 20px 24px;border-left:none;display:flex;flex-direction:column;justify-content:center;min-width:140px;background:rgba(255,255,255,.04);border-radius:12px;border:1px solid rgba(255,255,255,.06);padding:20px 24px;opacity:0;transform:translateY(10px);transition:opacity .4s var(--ease-out),transform .4s var(--ease-out)}
.hero-right.entered{opacity:1;transform:translateY(0)}
.hr-lbl{color:rgba(255,255,255,.4);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.hr-val{color:var(--cielo);font-size:15px;font-weight:500;font-family:'DM Mono',monospace}

/* TOOLBAR */
.tb-wrap{background:var(--white);border-bottom:1px solid var(--gris2);padding:16px 32px;box-shadow:var(--shadow-sm)}
.tb-inner{max-width:1440px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tf-g{display:flex;align-items:center;gap:8px}
.tf-g label{color:var(--text3);font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.tb-wrap select,.tb-wrap input{border:1.5px solid var(--gris2);border-radius:20px;color:var(--text);font-size:13px;padding:9px 16px;min-height:40px;font-family:'DM Sans',sans-serif;background:var(--gris);outline:none;transition:var(--ease)}
.tb-wrap select:focus,.tb-wrap input:focus{border-color:var(--celeste);background:#fff;box-shadow:0 0 0 3px rgba(62,140,255,.1)}
.tb-wrap input::placeholder{color:var(--text3)}
.tb-cnt{margin-left:auto;color:var(--text3);font-size:12px;font-family:'DM Mono',monospace}

/* MAIN */
.main{max-width:1440px;margin:28px auto;padding:0 32px 48px}

/* TABLE CARD */
.tc{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--gris2);overflow:hidden}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:var(--gris)}
thead tr{border-bottom:1.5px solid var(--gris2)}
th{padding:14px 18px;text-align:left;font-weight:600;font-size:11px;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;cursor:pointer;white-space:nowrap;user-select:none;transition:var(--ease)}
th#th12{background:var(--marino);color:var(--celeste);border-radius:6px 6px 0 0}
th:hover{color:var(--text2)}
th.asc::after{content:' ↑';color:var(--celeste)}
th.desc::after{content:' ↓';color:var(--celeste)}
tbody tr{border-bottom:1px solid var(--gris);transition:background-color 150ms var(--ease-out),transform 200ms var(--ease-out),box-shadow 200ms var(--ease-out);cursor:default;opacity:0;transform:translateY(6px);animation:rowIn .35s var(--ease-out) forwards}
tbody tr:last-child{border-bottom:none}
tbody tr:nth-child(even) td{background:#F8FAFC}
tbody tr.sel td{background:#EEF4FF}
@keyframes rowIn{to{opacity:1;transform:translateY(0) scale(1)}}
td{padding:16px 18px;vertical-align:middle}
.no-r{padding:60px;text-align:center;color:var(--text3)}

/* Table cells */
.cname{font-weight:600;font-size:14px;color:var(--text)}
.csub{font-size:12px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace}
.pi{display:flex;align-items:center;gap:6px;margin-top:5px}
.pt{flex:1;max-width:90px;height:6px;background:var(--gris2);border-radius:3px;overflow:hidden}
.pf{height:6px;border-radius:3px;transition:width .6s var(--ease-out)}
.pl{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;flex-shrink:0}

/* Badges */
.b{display:inline-flex;align-items:center;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.3px;white-space:nowrap;line-height:1.4}
.b-g{background:#EEF4FF;color:var(--celeste2);border:1px solid #BFDBFE}
.b-cat{background:var(--marino);color:#fff;font-size:12px;min-width:28px;justify-content:center;font-family:'DM Mono',monospace;padding:5px 10px;border-radius:6px}
.b-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
.b-al{background:var(--al-bg);color:var(--al);border:1px solid var(--al-border)}
.b-ro{background:var(--ro-bg);color:var(--ro);border:1px solid var(--ro-border)}
.b-inc{background:var(--inc-bg);color:var(--inc);border:1px solid var(--inc-border)}
.b-nd3{background:var(--nd-bg);color:var(--nd);border:1px solid var(--nd-border)}

.am{font-weight:600;font-size:14px;font-family:'DM Mono',monospace;text-align:right}
.pc{font-weight:700;font-size:14px;font-family:'DM Mono',monospace;text-align:right}
.dbtn{padding:8px 16px;font-size:12px;border:1.5px solid var(--gris2);border-radius:8px;background:var(--white);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:transform 160ms var(--ease-out),border-color .2s var(--ease-out),color .2s var(--ease-out),background-color .2s var(--ease-out)}
.dbtn:active{transform:scale(0.97)}

/* DETAIL VIEW (página nueva) */
.dv{display:none;background:var(--white);min-height:100vh}
.dv.on{display:block}
.dv-back-wrap{max-width:1440px;margin:0 auto;padding:20px 32px 0}
.back-btn{background:#fff;color:var(--marino);border:1.5px solid var(--gris2);padding:8px 16px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;gap:6px;transition:transform 160ms var(--ease-out),background .2s var(--ease-out),color .2s var(--ease-out),border-color .2s var(--ease-out)}
.back-btn:hover{background:#F0F6FF;color:var(--celeste);border-color:var(--celeste);transform:translateX(-2px)}
.back-btn:active{transform:scale(0.97)}
.dv-inner{max-width:1440px;margin:0 auto;padding-bottom:48px}
.sp{background:var(--white);display:flex;flex-direction:column;width:100%}
.sph{background:var(--marino);padding:26px 0;flex-shrink:0;position:relative}
.sph-content{max-width:960px;margin:0 auto;padding:0 32px;width:100%;box-sizing:border-box}
.sph::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(62,140,255,.4),transparent)}
.sph-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sph-name{color:#fff;font-size:21px;font-weight:600;line-height:1.2;flex:1}
.sph-x{width:34px;height:34px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:rgba(255,255,255,.6);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 160ms var(--ease-out),background .2s var(--ease-out),color .2s var(--ease-out)}
.sph-x:hover{background:rgba(255,255,255,.18);color:#fff}
.sph-x:active{transform:scale(0.9)}
.sph-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.sph-tag{padding:4px 11px;border-radius:6px;font-size:11px;font-weight:500;background:rgba(255,255,255,.08);color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.1)}
.sph-prog{display:flex;align-items:center;gap:10px}
.sph-sem{flex-shrink:0}
.sph-pct{color:rgba(255,255,255,.55);font-size:13px;font-family:'DM Mono',monospace;flex-shrink:0}
.sph-bar{flex:1;height:7px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.sph-fill{height:7px;border-radius:4px;transition:width .7s var(--ease-out) .1s}

/* Panel body */
.spb{flex:1;padding:0;max-width:960px;margin:0 auto;width:100%}
.sps{padding:24px 32px;border-bottom:1px solid var(--gris2)}
.sps:last-child{border-bottom:none}
/* Sección Tope 12M - fondo blanco */
.sps-12m{background:var(--white);border:1px solid var(--gris2);border-radius:12px;margin:20px 32px;padding:24px 28px}
.sps-12m+.sps{border-top:1px solid var(--gris2)}
.cuota-label{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px;text-align:center}
.sec-t{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.6px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center}
.sec-t::before,.sec-t::after{content:'';flex:1;height:1px;background:var(--gris2)}

/* KPI grid */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kc{background:var(--gris);border-radius:var(--radius-sm);padding:14px;border:1px solid transparent}
.kc.dark{background:var(--gris)}
.kc.acc{background:#EEF4FF;border-color:#BFDBFE}
.kl{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.kc.dark .kl{color:var(--text2)}
.kv{font-size:22px;font-weight:700;color:var(--text);font-family:'DM Mono',monospace;line-height:1}
.kc.dark .kv{color:var(--text);font-size:22px}
.kc.acc .kv{color:var(--celeste2)}
.ks{font-size:12px;color:var(--text2);margin-top:4px;font-weight:500}
.kc.dark .ks{color:var(--text2)}

/* Progress */
.pr{margin:8px 0}
.prh{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.prh span{font-size:13px;color:var(--text2)}
.prh strong{font-size:13px;color:var(--text);font-family:'DM Mono',monospace}
.prb{height:10px;background:var(--gris2);border-radius:5px;overflow:hidden}
.prf{height:10px;border-radius:5px;transition:width .6s var(--ease-out) .2s}

/* Alert */
.al-box{padding:12px 16px;border-radius:8px;font-size:12px;margin:10px 0;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.al-box.inc{background:var(--inc-bg);border:1px solid var(--inc-border);color:var(--inc)}
.al-box.ro{background:var(--ro-bg);border:1px solid var(--ro-border);color:var(--ro)}

/* Cuota cards */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{border:1.5px solid var(--gris2);border-radius:var(--radius-sm);padding:16px}
.cc.nx{border-color:#93C5FD;background:linear-gradient(160deg,#F0F6FF,#EBF3FF)}
.cc.crit{border-color:var(--ro-border);background:var(--ro-bg)}
.cc-tit{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;text-align:center}
.cc-cat{font-size:30px;font-weight:700;color:var(--text);font-family:'DM Mono',monospace;margin-bottom:6px}
.cc.nx .cc-cat{color:var(--celeste2)}
.cc.crit .cc-cat{color:var(--ro)}
.ccl{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--gris);font-size:12px}
.ccl:last-of-type{border-bottom:none}
.ccn{color:var(--text2);font-size:13px}
.cca{font-weight:500;color:var(--text);font-family:'DM Mono',monospace}
.cc-sub{display:flex;justify-content:space-between;padding:6px 8px;background:var(--gris);border-radius:5px;margin-top:8px;font-size:11px}
.cc-tot{background:var(--gris);border-radius:7px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.cc-tot .ccn{color:var(--text3);font-size:11px;font-weight:600}
.cc-tot .cca{color:var(--text);font-size:15px;font-weight:700}
.cc-diff{margin-top:8px;text-align:center;font-size:10px;color:var(--celeste2);font-weight:600}

/* Month chart */
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mc{border-radius:7px;padding:10px 5px;text-align:center;transition:transform 160ms var(--ease-out)}
.mc.ok-m{background:var(--ok-bg);border:1px solid var(--ok-border)}
.mc.z-m{background:var(--gris);border:1px solid transparent}
.mc.ms-m{background:var(--inc-bg);border:1px solid var(--inc-border)}
.mc.ft-m{background:var(--gris);border:1px dashed var(--gris3);opacity:.45}
.mc-l{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:4px;letter-spacing:.3px}
.mc-bw{height:52px;display:flex;align-items:flex-end;justify-content:center;margin:3px 0}
.mc-bar{width:100%;border-radius:3px;min-height:2px}
.mc-v{font-size:12px;font-weight:600;color:var(--text);font-family:'DM Mono',monospace}
.mc.z-m .mc-v{color:var(--text3)}
.mc.ms-m .mc-v{color:var(--inc)}

/* Panel footer */
.spf{padding:24px 32px;border-top:1px solid var(--gris2);display:flex;gap:10px;max-width:960px;margin:0 auto;width:100%}
.btn-p{flex:1;padding:13px;font-size:13px;background:var(--marino);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:transform 160ms var(--ease-out),background-color .2s var(--ease-out)}
.btn-p:hover{background:var(--marino3)}
.btn-p:active{transform:scale(0.97)}
.btn-s{padding:13px 20px;font-size:13px;background:var(--gris);color:var(--text2);border:1.5px solid var(--gris2);border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:transform 160ms var(--ease-out),background-color .2s var(--ease-out)}
.btn-s:hover{background:var(--gris2)}
.btn-s:active{transform:scale(0.97)}

.err-b{background:var(--ro-bg);border-bottom:1.5px solid var(--ro-border);padding:12px 32px;color:var(--ro);font-size:13px;display:none;font-weight:500}

/* Hover guards for touch devices */
@media(hover:hover) and (pointer:fine){
  .hero-stat.entered:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);transform:translateY(0) scale(1.02)}
  tbody tr:hover{transform:translateY(0) scale(1.02);box-shadow:0 2px 12px rgba(0,0,0,.10);position:relative;z-index:1}
  tbody tr:hover td{background:#EDF2FF}
  .mc:hover{transform:translateY(-2px)}
  .dbtn:hover{border-color:var(--celeste);color:var(--celeste);background:#F0F6FF;transform:translateX(2px)}
}

/* Reduced motion: keep opacity/color, remove transforms */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.15s!important}
  .hero-stat{opacity:1!important;transform:none!important}
  tbody tr{opacity:1!important;transform:none!important;animation:none!important}
  .mc:hover{transform:none!important}
}

@media(max-width:900px){
  .nav,.hero,.tb-wrap,.main,.err-b{padding-left:20px;padding-right:20px}
  .main{padding-left:16px;padding-right:16px}
  .kgrid{grid-template-columns:1fr 1fr}

const M2=['Jul-25','Ago-25','Sep-25','Oct-25','Nov-25','Dic-25','Ene-26','Feb-26','Mar-26','Abr-26','May-26','Jun-26'];
const PAST_C1=12,PAST_C2=9;
let CATS=[],IC=[],IAS=[],IAB=[],CL=[],C1={},C2={},TK=108357084.05,DASH={};
let sc='t',sd=-1,sel=null;

function csvU(g){return`https://docs.google.com/spreadsheets/d/e/${PUB}/pub?gid=${g}&single=true&output=csv`;}
function parseCSV(t){
  const rows=[];const lines=t.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  for(const l of lines){if(!l.trim())continue;const cells=[];let cur='',inQ=false;
    for(let i=0;i<l.length;i++){if(l[i]==='"'){if(inQ&&l[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(l[i]===','&&!inQ){cells.push(cur.trim());cur='';}else cur+=l[i];}
    cells.push(cur.trim());rows.push(cells);}return rows;
}
function n(v){
  v=String(v||'').trim().replace(/^"|"$/g,'');
  if(!v||v==='-'||v.toUpperCase()==='NAN'||v==='#N/A')return 0;
  v=v.replace(/\$/g,'').replace(/\s/g,'').replace(/%/g,'');
  if(/^\d{1,3}(\.\d{3})+,\d+$/.test(v))return parseFloat(v.replace(/\./g,'').replace(',','.'));
  if(/^\d+,\d+$/.test(v))return parseFloat(v.replace(',','.'));
  if(/^\d{1,3}(\.\d{3})+$/.test(v))return parseFloat(v.replace(/\./g,''));
  if(/^\d+(\.\d+)?$/.test(v))return parseFloat(v);
  const x=parseFloat(v.replace(/\./g,'').replace(',','.'));return isNaN(x)?0:x;
}
function emp(v){v=String(v||'').trim().replace(/^"|"$/g,'');return!v||v===''||v==='nan';}
function cl(v){return String(v||'').trim().replace(/^"|"$/g,'');}
async function fcsv(g){const r=await fetch(csvU(g));if(!r.ok)throw new Error('HTTP '+r.status);return parseCSV(await r.text());}

async function loadT(){
  const rows=await fcsv(GIDS.TOPES);CATS=[];
  for(const r of rows){const c=cl(r[0]);if(!'ABCDEFGHIJK'.includes(c)||c.length!==1)continue;
    CATS.push({c,t:n(r[1]),is:n(r[4]),ib:n(r[5]),j:n(r[6]),os:n(r[7]),tis:n(r[8]),tib:n(r[9]),tds:n(r[10]),tdb:n(r[11])});}
  if(CATS.length)TK=CATS[CATS.length-1].t;
}
async function loadI(){
  const rows=await fcsv(GIDS.IIBB);IC=[];IAS=[];IAB=[];let sec='';
  for(const r of rows){const f=cl(r[0]).toUpperCase();
    if(f.includes('AGIP')){sec='C';continue;}if(f.includes('ARBA')){sec='A';continue;}
    const c=cl(r[0]);if(!'ABCDEFGHIJK'.includes(c)||c.length!==1)continue;
    if(sec==='C')IC.push(n(r[2]));if(sec==='A'){IAS.push(n(r[2]));IAB.push(n(r[3]));}}
}
async function loadC(g){
  const rows=await fcsv(g);const d={};let hi=-1;
  for(let i=0;i<rows.length;i++){for(let j=0;j<rows[i].length;j++){if(cl(rows[i][j]).toUpperCase()==='CLIENTE'){hi=i;break;}}if(hi>-1)break;}
  if(hi===-1)return d;
  const hdr=rows[hi].map(h=>cl(h).toUpperCase());const iN=hdr.indexOf('CLIENTE');
  let iS=-1;for(let j=0;j<hdr.length;j++){if(/^(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)/.test(hdr[j])){iS=j;break;}}
  if(iN===-1||iS===-1)return d;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];const nm=cl(r[iN]);if(!nm||nm.toUpperCase()==='CLIENTE')continue;
    const m=[],ms=[];
    for(let j=iS;j<iS+12;j++){const raw=j<r.length?r[j]:'';ms.push(emp(raw));m.push(n(raw));}
    while(m.length<12){m.push(0);ms.push(true);}d[nm]={months:m,missing:ms};}
  return d;
}
async function loadCL(){
  const rows=await fcsv(GIDS.CLIENTES);CL=[];let hi=-1;
  for(let i=0;i<rows.length;i++){for(let j=0;j<rows[i].length;j++){if(cl(rows[i][j]).toUpperCase()==='NOMBRE'){hi=i;break;}}if(hi>-1)break;}
  if(hi===-1)return;
  const h=rows[hi].map(x=>cl(x).toUpperCase());
  const iN=h.indexOf('NOMBRE'),iG=h.indexOf('GRUPO'),iA=h.indexOf('ACTIVIDAD');
  const iSL=h.indexOf('SITUACION LABORAL'),iI=h.indexOf('REGIMEN IIBB'),iE=h.indexOf('ESTADO'),iCat=h.indexOf('CATEGORIA')>-1?h.indexOf('CATEGORIA'):h.indexOf('CATEGORÍA');
  const iAdh=h.indexOf('ADHERENTES OS')>-1?h.indexOf('ADHERENTES OS'):h.indexOf('ADHERENTES');
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];const nm=cl(r[iN>-1?iN:1]);if(!nm||nm.toUpperCase()==='NOMBRE')continue;
    if(cl(r[iE>-1?iE:14]).toUpperCase()==='BAJA')continue;
    CL.push({n:nm,g:cl(r[iG>-1?iG:2])||'INDIVIDUAL',a:cl(r[iA>-1?iA:5])||'Servicios',sl:cl(r[iSL>-1?iSL:6])||'Independiente',iibb:cl(r[iI>-1?iI:7])||'Exento',catSheet:cl(r[iCat>-1?iCat:4]).toUpperCase()||'',adhOS:iAdh>-1?n(r[iAdh]):0});}
}
async function loadDash(){
  const rows=await fcsv(GIDS.DASH);DASH={};let hi=-1;
  for(let i=0;i<rows.length;i++){for(let j=0;j<rows[i].length;j++){if(cl(rows[i][j]).toUpperCase()==='CLIENTE'){hi=i;break;}}if(hi>-1)break;}
  if(hi===-1)return;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];const nm=cl(r[1]);if(!nm||nm.toUpperCase()==='CLIENTE')continue;
    DASH[nm]={acum12m:n(r[9]),pct12m:n(r[10])/100,sem12m:cl(r[11])};
  }
}

async function loadAll(){
  const btn=document.querySelector('.nav-refresh');if(btn)btn.textContent='↻';
  sL(true);
  try{
    prog(10,'Cargando escalas...');await loadT();
    prog(30,'Cargando IIBB...');await loadI();
    prog(50,'Cargando Ciclo 1...');C1=await loadC(GIDS.CICLO1);
    prog(70,'Cargando Ciclo 2...');C2=await loadC(GIDS.CICLO2);
    prog(85,'Cargando clientes...');await loadCL();
    prog(92,'Cargando 12M...');await loadDash();
    prog(100,'Listo ✓');
    CL.forEach(c=>{
      const d1=C1[c.n]||{months:new Array(12).fill(0),missing:new Array(12).fill(true)};
      const d2=C2[c.n]||{months:new Array(12).fill(0),missing:new Array(12).fill(true)};
      c.c1=d1.months;c.m1=d1.missing;c.c2=d2.months;c.m2=d2.missing;
      const dd=DASH[c.n]||{acum12m:0,pct12m:0,sem12m:''};
      c.acum12m=dd.acum12m;c.pct12m=dd.pct12m;c.sem12m=dd.sem12m;});
    const s=document.getElementById('fg');const ex=[...s.options].map(o=>o.value);
    [...new Set(CL.map(c=>c.g))].sort().forEach(g=>{if(!ex.includes(g)){const o=document.createElement('option');o.value=g;o.textContent=g;s.appendChild(o);}});
    const now=new Date();
    document.getElementById('lupd').textContent=now.toLocaleDateString('es-AR')+' '+now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+' · K: $'+fmtk(TK);
    hideE();render();
    document.querySelectorAll('.hero-stat,.hero-right').forEach((el,i)=>{setTimeout(()=>el.classList.add('entered'),i*60);});
    setTimeout(()=>sL(false),500);
    // Detectar parámetro ?cliente= en URL para mostrar detalle directamente
    const params=new URLSearchParams(window.location.search);
    const clienteURL=params.get('cliente');
    if(clienteURL){
      const existe=CL.find(x=>x.n===clienteURL);
      if(existe) showDetail(clienteURL);
      else history.replaceState({},'',window.location.pathname);
    }
  }catch(e){showE('Error: '+e.message);sL(false);}
  if(btn)btn.textContent='↻ Actualizar';
}

function sL(v){const e=document.getElementById('ls');if(v)e.classList.remove('out');else e.classList.add('out');}
function prog(p,t){document.getElementById('lbar').style.width=p+'%';document.getElementById('ltxt').textContent=t;}
function showE(m){const e=document.getElementById('err');e.textContent=m;e.style.display='block';}
function hideE(){document.getElementById('err').style.display='none';}

function resolveCiclo(v){
  if(v==='auto'){const now=new Date(),y=now.getFullYear(),m=now.getMonth();if(y>2025||(y===2025&&m>=6))return'c2';return'c1';}
  return v;
}
function onCC(){
  const raw=document.getElementById('fc').value;
  const ci=resolveCiclo(raw);
  const lbl=ci==='c1'?'Ene-25 → Dic-25':'Jul-25 → Jun-26';
  document.getElementById('ciclo-val').textContent=raw==='auto'?lbl+' (auto)':lbl;
  document.getElementById('thlbl').textContent=ci==='c1'?'Ene–Dic':'Jul–Jun';
  render();
}

function gCi(t){for(let i=0;i<CATS.length;i++)if(t<=CATS[i].t)return i;return CATS.length-1;}
function gCiByName(nm){if(!nm)return-1;for(let i=0;i<CATS.length;i++)if(CATS[i].c===nm)return i;return-1;}
function gS(p,inc,nd){if(nd)return{k:'nd3',l:'Sin datos'};
  if(inc)return{k:'inc',l:'Incompleto'};if(p===0)return{k:'nd3',l:'Sin datos'};
  if(p>=0.8)return{k:'ro',l:'Rojo'};if(p>=0.5)return{k:'al',l:'Alerta'};return{k:'ok',l:'OK'};
}function gNd(miss,ci){const p=ci==='c1'?PAST_C1:PAST_C2;for(let i=0;i<p;i++)if(miss[i])return true;return false;}
function fmt(v){return Math.round(v).toLocaleString('es-AR');}
function fmtk(v){if(v>=1000000)return(v/1000000).toFixed(1)+'M';if(v>=1000)return(v/1000).toFixed(0)+'k';return Math.round(v).toString();}
function fmtp(p){return(p*100).toFixed(1)+'%';}
function sCol(k){return k==='ro'?'#DC2626':k==='al'?'#D97706':k==='ok'?'#16A34A':k==='inc'?'#7C3AED':'#94A3B8';}
function gInc(arr,miss,ci){const p=ci==='c1'?PAST_C1:PAST_C2;for(let i=0;i<p;i++)if(miss[i])return true;return false;}
function sem12k(s){s=String(s||'');if(s.includes('ROJO'))return'ro';if(s.includes('ALERTA'))return'al';if(s.includes('OK'))return'ok';return'nd3';}
function sem12lbl(s){s=String(s||'');if(s.includes('ROJO'))return'Rojo';if(s.includes('ALERTA'))return'Alerta';if(s.includes('OK'))return'OK';if(!s)return'Sin datos';return s;}
function gIIBB(c,ci){
  if(c.iibb==='Exento')return 0;if(c.iibb.includes('Convenio'))return null;
  if(c.iibb.includes('CABA'))return IC[ci]||0;
  if(c.iibb.includes('BsAs')||c.iibb.includes('Buenos'))return c.a==='Venta de Bienes'?(IAB[ci]||0):(IAS[ci]||0);
  return 0;
}
function gCu(c,ci){
  if(!CATS.length)return{imp:0,jub:0,os:0,total:0};
  const cat=CATS[ci],eB=c.a==='Venta de Bienes';
  const sl=String(c.sl||'');
  // 'Relación de dependencia' y 'Jubilado': sólo imp. integrado (jub y OS las paga el empleador o no aplican)
  const soloImp=sl==='Relación de dependencia'||sl==='Jubilado';
  if(soloImp)return{imp:eB?cat.ib:cat.is,jub:0,os:0,total:eB?cat.tdb:cat.tds};
  // Autónomo (Servicios, Comercio, Independiente, etc): imp + jub + os, con posible multiplicador por adherentes de OS
  const adh=Math.max(0,+c.adhOS||0);
  const imp=eB?cat.ib:cat.is,jub=cat.j,os=cat.os*(1+adh);
  return{imp,jub,os,total:imp+jub+os};
}
// TOTAL / MES unificado (misma fórmula que usa el detalle individual)
function gTotMes(c,ci){
  const cu=gCu(c,ci),ib=gIIBB(c,ci);
  return cu.total+(ib===null?0:ib);
}

function gFilt(){
  const g=document.getElementById('fg').value,ci=resolveCiclo(document.getElementById('fc').value);
  const sf=document.getElementById('fs').value,q=document.getElementById('fq').value.toLowerCase();
  return CL.filter(c=>{
    if(g&&c.g!==g)return false;if(q&&!c.n.toLowerCase().includes(q))return false;
    const arr=ci==='c1'?c.c1:c.c2,miss=ci==='c1'?c.m1:c.m2;
    const tot=arr.reduce((a,b)=>a+b,0);
    const s=gS(TK>0?tot/TK:0,gInc(arr,miss,ci),gNd(miss,ci));
    if(sf&&s.k!==sf)return false;return true;
  }).map(c=>{
    const ci=resolveCiclo(document.getElementById('fc').value);
    const arr=ci==='c1'?c.c1:c.c2,miss=ci==='c1'?c.m1:c.m2;
    const tot=arr.reduce((a,b)=>a+b,0),pct=TK>0?tot/TK:0;
    const cSheet=gCiByName(c.catSheet),cIdx=cSheet>-1?cSheet:gCi(tot),inc=gInc(arr,miss,ci);
    return{...c,arr,miss,tot,pct,ci:cIdx,inc,s:gS(pct,inc,gNd(miss,cIdx)),acum12m:c.acum12m||0,pct12m:c.pct12m||0,sem12m:c.sem12m||'',supera:cSheet>-1&&cSheet<gCi(tot),catActual:c.catSheet||''};
  }).sort((a,b)=>{
    if(sc==='n')return sd*a.n.localeCompare(b.n);if(sc==='g')return sd*a.g.localeCompare(b.g);
    if(sc==='t')return sd*(a.tot-b.tot);if(sc==='p')return sd*(a.pct-b.pct);
    if(sc==='c')return sd*(a.ci-b.ci);if(sc==='m')return sd*(a.acum12m-b.acum12m);return 0;
  });
}

function sortBy(col){
  ['n','g','c','t','p','12'].forEach(k=>{const e=document.getElementById('th'+k);if(e)e.className='';});
  if(sc===col)sd*=-1;else{sc=col;sd=-1;}
  const e=document.getElementById('th'+col);if(e)e.className=sd===-1?'desc':'asc';render();
}

function render(){
  const data=gFilt();
  document.getElementById('st').textContent=data.length;
  document.getElementById('so').textContent=data.filter(d=>d.s.k==='ok').length;
  document.getElementById('sa').textContent=data.filter(d=>d.s.k==='al').length;
  document.getElementById('sr').textContent=data.filter(d=>d.s.k==='ro').length;
  document.getElementById('srx').textContent=data.filter(d=>sem12k(d.sem12m)==='ro').length;
  document.getElementById('tcnt').textContent=data.length+' clientes';
  const tbody=document.getElementById('tbody');
  if(!data.length){tbody.innerHTML=`<tr><td colspan="8" class="no-r">No hay clientes que coincidan.</td></tr>`;return;}
  tbody.innerHTML=data.map((d,i)=>{
    const cL=CATS.length?CATS[d.ci].c:'—',sc2=sCol(d.s.k);
    const isS=sel===d.n?'sel':'';
    const delay=Math.min(i,8)*40;
    return`<tr class="${isS}" style="animation-delay:${delay}ms">
      <td><div class="cname">${d.n}</div>
        <div class="pi"><div class="pt"><div class="pf" style="width:${Math.min(d.pct*100,100).toFixed(1)}%;background:${sc2}"></div></div>
        <span class="pl">${fmtp(d.pct)}</span></div></td>
      <td><span class="b b-g">${d.g}</span></td>
      <td style="text-align:center"><span class="b b-cat">${cL}</span></td>
      <td style="text-align:right"><div class="pc" style="color:${sCol(sem12k(d.sem12m))};font-size:15px;font-weight:700">${fmtp(d.pct12m)}</div><div class="pi"><div class="pt" style="height:6px"><div class="pf" style="width:${Math.min(d.pct12m*100,100).toFixed(1)}%;background:${sCol(sem12k(d.sem12m))}"></div></div></div><div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:3px">${fmtk(d.acum12m)}</div><span class="b b-${sem12k(d.sem12m)}" style="font-size:11px;padding:4px 10px;margin-top:3px;display:inline-flex;border-width:2px">${sem12lbl(d.sem12m)}</span></td>
      <td class="am">${fmt(d.tot)}</td>
      <td class="pc" style="color:${sc2}">${fmtp(d.pct)}</td>
      <td><span class="b b-${d.s.k}">${d.s.l}</span>${d.supera?`<span class="b b-ro" style="margin-left:6px;font-size:10px;padding:2px 6px;">Superó Cat. ${d.catActual}</span>`:''}</td>
      <td><button class="dbtn" onclick="openP('${d.n.replace(/'/g,"\\'")}')">Ver →</button></td>
    </tr>`;
  }).join('');
}

function showDetail(nombre){
  sel=nombre;
  const c=CL.find(x=>x.n===nombre);
  if(!c){closeP();return;}
  buildP(nombre);
  document.querySelector('.nav').style.display='';
  document.querySelector('.hero').style.display='none';
  document.querySelector('.tb-wrap').style.display='none';
  document.querySelector('.main').style.display='none';
  document.getElementById('dv').classList.add('on');
  window.scrollTo(0,0);
}
function showList(){
  sel=null;
  document.getElementById('dv').classList.remove('on');
  document.querySelector('.hero').style.display='';
  document.querySelector('.tb-wrap').style.display='';
  document.querySelector('.main').style.display='';
  document.querySelectorAll('tbody tr').forEach(r=>r.classList.remove('sel'));
}
function openP(nombre){
  history.pushState({cliente:nombre},'','?cliente='+encodeURIComponent(nombre));
  showDetail(nombre);
}
function closeP(){
  if(window.location.search.includes('cliente=')){
    history.pushState({},'',window.location.pathname);
  }
  showList();
}
window.addEventListener('popstate',e=>{
  const params=new URLSearchParams(window.location.search);
  const cliente=params.get('cliente');
  if(cliente && CL.length){showDetail(cliente);}
  else{showList();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape' && document.getElementById('dv').classList.contains('on'))closeP();});

function buildP(nombre){
  const ci=document.getElementById('fc').value,meses=ci==='c1'?M1:M2,pc=ci==='c1'?PAST_C1:PAST_C2;
  const c=CL.find(x=>x.n===nombre);if(!c||!CATS.length)return;
  const arr=ci==='c1'?c.c1:c.c2,miss=ci==='c1'?c.m1:c.m2;
  const tot=arr.reduce((a,b)=>a+b,0),pct=TK>0?tot/TK:0;
  const cSheet=gCiByName(c.catSheet),autoIdx=gCi(tot),superaCat=cSheet>-1&&cSheet<autoIdx,ci2=cSheet>-1?cSheet:autoIdx,cat=CATS[ci2],nxIdx=superaCat?autoIdx:(ci2<CATS.length-1?ci2+1:-1),nx=nxIdx>=0?CATS[nxIdx]:null;
  const inc=gInc(arr,miss,ci),s=gS(pct,inc,gNd(miss,ci)),sc2=sCol(s.k);
  const maxV=Math.max(...arr,1),fCat=nx?nx.t-tot:0,fMax=TK-tot,pCat=nx?tot/nx.t:1;
  const cu=gCu(c,ci2),cuN=nx?gCu(c,ci2+1):null;
  const ib=gIIBB(c,ci2),ibN=nx?gIIBB(c,ci2+1):null;
  const totM=gTotMes(c,ci2),totNM=cuN?gTotMes(c,ci2+1):null;
  const eI=c.sl==='Independiente';

  // Header
  document.getElementById('sph').innerHTML=`
    <div class="sph-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <button class="back-btn" onclick="closeP()">← Volver</button>

  if(!canB||typeof Chart==='undefined') return;

  Chart.getChart(canB)?.destroy();
  const maxV=Math.max(...arr,1);
  const barColors=arr.map(v=>{

async function exportPDF(nombre){
  if(typeof html2canvas==='undefined'||!window.jspdf){
    alert('Las bibliotecas de PDF no cargaron. Recarga la pagina e intenta de nuevo.');return;
  }
  const btn=document.getElementById('pdf-btn');
  if(btn){btn.textContent='Generando PDF...';btn.disabled=true;}

  const panel=document.getElementById('sp');
  const spb=panel?panel.querySelector('.spb'):null;
  const spf=panel?panel.querySelector('.spf'):null;
  const xBtn=panel?panel.querySelector('.sph-x'):null;

  // Capture original inline styles BEFORE any modification
  const origPanel=panel?{
    position:panel.style.position,width:panel.style.width,transform:panel.style.transform,
    height:panel.style.height,top:panel.style.top,right:panel.style.right,bottom:panel.style.bottom,
    boxShadow:panel.style.boxShadow,zIndex:panel.style.zIndex,overflow:panel.style.overflow
  }:null;
  const origSpb=spb?{overflow:spb.style.overflow,height:spb.style.height}:null;
  const origXBtn=xBtn?xBtn.style.display:'';
  const origSpf=spf?spf.style.display:'';

  const chartBackups=[];
  let sections=[];
  let restored=false;

  const restore=()=>{
    if(restored) return;
    restored=true;
    try{
      if(panel&&origPanel) Object.assign(panel.style,origPanel);
      if(spb&&origSpb) Object.assign(spb.style,origSpb);
      if(spf) spf.style.display=origSpf;
      if(xBtn) xBtn.style.display=origXBtn;
      sections.forEach(s=>{try{s.style.pageBreakInside='';s.style.breakInside='';}catch(_){}});
      chartBackups.forEach(b=>{
        try{
          if(!b||!b.canvas||!b.parent) return;
          if(b.canvas.parentNode) return; // already restored
          const img=b.next&&b.next.parentNode===b.parent?b.next.previousSibling:b.parent.lastChild;
          if(img&&img.tagName==='IMG'&&img.parentNode===b.parent){
            b.parent.replaceChild(b.canvas,img);
          }
        }catch(ex){console.warn('chart restore:',ex);}
      });
    }catch(e){console.warn('restore warning:',e);}
  };

  try{
    /* 1. Hide X button and footer */
    if(xBtn) xBtn.style.display='none';
    if(spf) spf.style.display='none';

    /* 2. Convert Chart.js canvases to static images */
    const chartCanvases=panel?panel.querySelectorAll('canvas'):[];
    chartCanvases.forEach(cv=>{
      try{
        const img=document.createElement('img');
        img.src=cv.toDataURL('image/png');
        img.style.width='100%';
        img.style.maxWidth=cv.style.maxWidth||'100%';
        img.style.maxHeight=cv.style.maxHeight||'auto';
        img.style.height=cv.getAttribute('height')?cv.getAttribute('height')+'px':'auto';
        img.style.display='block';
        chartBackups.push({canvas:cv,parent:cv.parentNode,next:cv.nextSibling});
        cv.parentNode.replaceChild(img,cv);
      }catch(ex){console.warn('Canvas convert err:',ex);}
    });

    /* 3. Prepare panel for capture */
    if(panel){
      panel.style.position='static';
      panel.style.width='680px';
      panel.style.transform='none';
      panel.style.height='auto';
      panel.style.top='auto';
      panel.style.right='auto';
      panel.style.bottom='auto';
      panel.style.boxShadow='none';
      panel.style.zIndex='auto';
      panel.style.overflow='visible';
    }
    if(spb){spb.style.overflow='visible';spb.style.height='auto';}

    /* 4. Add page-break hints: each .sps section should avoid breaking */
    sections=panel?Array.from(panel.querySelectorAll('.sps')):[];
    sections.forEach(s=>{s.style.pageBreakInside='avoid';s.style.breakInside='avoid';});

    await new Promise(r=>setTimeout(r,150));

    /* 5. Capture each section separately for better pagination */
    const sph=panel?panel.querySelector('.sph'):null;
    const allParts=[sph,...sections];
    const partCanvases=[];
    for(const part of allParts){
      if(!part) continue;
      try{
        const c=await html2canvas(part,{
          scale:1.5,useCORS:true,backgroundColor:null,logging:false,allowTaint:true,
          width:680,windowWidth:680,scrollX:0,scrollY:0
        });
        if(c&&c.width>0&&c.height>0) partCanvases.push(c);
      }catch(ex){
        console.warn('html2canvas error for part:',part,ex);
      }
    }

    /* 6. Restore everything BEFORE building PDF */
    restore();

    if(!partCanvases.length) throw new Error('No se pudo capturar ninguna sección del panel.');

    /* 7. Build PDF placing each section, adding pages when needed */
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const pageW=pdf.internal.pageSize.getWidth();
    const pageH=pdf.internal.pageSize.getHeight();
    const margin=8;
    const usableW=pageW-margin*2;
    const usableH=pageH-margin*2;
    let curY=margin;

    for(const cvs of partCanvases){
      const imgData=cvs.toDataURL('image/png');
      const imgW=usableW;
      const imgH=(cvs.height*imgW)/cvs.width;

      if(curY+imgH>pageH-margin && curY>margin+1){
        pdf.addPage();
        curY=margin;
      }

      if(imgH>usableH){
        let yOff=0;
        while(yOff<imgH){
          if(yOff>0){pdf.addPage();curY=margin;}
          const sliceH=Math.min(usableH,imgH-yOff);
          pdf.addImage(imgData,'PNG',margin,curY-yOff,imgW,imgH);
          yOff+=usableH;
          curY=margin+sliceH;
        }
      } else {
        pdf.addImage(imgData,'PNG',margin,curY,imgW,imgH);
        curY+=imgH+2;
      }
    }

    const mNames=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const now=new Date();
    const mesAnio=mNames[now.getMonth()]+now.getFullYear();
    const fileName='Reporte_'+nombre.replace(/\s+/g,' ').trim()+'_'+mesAnio+'.pdf';
    pdf.save(fileName);
  }catch(e){
    console.error('Error generando PDF:',e);
    restore();
    alert('Error al generar el PDF. Intenta de nuevo.\n'+(e&&e.message?e.message:''));
  }finally{
    restore();
    if(btn){btn.textContent='\u2193 Exportar PDF';btn.disabled=false;}
  }
}

function exportExcel(nombre){

  if(!c)return;
  const arr=ci==='c1'?c.c1:c.c2;
  const tot=arr.reduce((a,b)=>a+b,0);
  const pct=TK>0?tot/TK:0;
  const cSheet=gCiByName(c.catSheet),ci2=cSheet>-1?cSheet:gCi(tot);
  const cat=CATS[ci2];
  const nx=ci2<CATS.length-1?CATS[ci2+1]:null;
  const cu=gCu(c,ci2);
  const ib=gIIBB(c,ci2);
  const totM=gTotMes(c,ci2);
  const s=gS(pct,false);
  const fecha=new Date().toLocaleDateString('es-AR').replace(/\//g,'-');

  const wb=XLSX.utils.book_new();

  // ── COLORS ──────────────────────────────────────────────
  const C_MARINO  = '0E1A2C';
  const C_CELESTE = '3E8CFF';
  const C_CIELO   = 'A0C8F3';
  const C_WHITE   = 'FFFFFF';
  const C_GRIS    = 'E8EBF1';
  const C_GRIS2   = 'F4F6F9';
  const C_OK      = 'E8F5E9';
  const C_OK_TXT  = '1B5E20';
  const C_AL      = 'FFF8E1';
  const C_AL_TXT  = 'E65100';
  const C_RO      = 'FFEBEE';
  const C_RO_TXT  = 'B71C1C';

  const semBg  = s.k==='ro'?C_RO  :s.k==='al'?C_AL  :C_OK;
  const semTxt = s.k==='ro'?C_RO_TXT:s.k==='al'?C_AL_TXT:C_OK_TXT;

  // ── STYLE HELPERS ────────────────────────────────────────
  function hdr(fgColor){
    return{font:{bold:true,color:{rgb:C_WHITE},sz:11},
           fill:{fgColor:{rgb:fgColor||C_MARINO}},
           alignment:{horizontal:'left',vertical:'center',wrapText:true},
           border:{bottom:{style:'thin',color:{rgb:C_CELESTE}}}};
  }
  function cell(bold,bg,fg,sz,halign){
    return{font:{bold:!!bold,color:{rgb:fg||'1E293B'},sz:sz||10},
           fill:{fgColor:{rgb:bg||C_WHITE}},
           alignment:{horizontal:halign||'left',vertical:'center',wrapText:true},
           border:{bottom:{style:'thin',color:{rgb:'E4E9F0'}},
                   right:{style:'thin',color:{rgb:'E4E9F0'}}}};
  }
  function titleCell(){
    return{font:{bold:true,color:{rgb:C_WHITE},sz:16},
           fill:{fgColor:{rgb:C_MARINO}},
           alignment:{horizontal:'left',vertical:'center'}};
  }
  function subCell(){
    return{font:{color:{rgb:C_CIELO},sz:10},
           fill:{fgColor:{rgb:C_MARINO}},
           alignment:{horizontal:'left',vertical:'center'}};
  }
  function sectionHdr(color){
    return{font:{bold:true,color:{rgb:C_WHITE},sz:10,italic:false},
           fill:{fgColor:{rgb:color||C_CELESTE}},
           alignment:{horizontal:'left',vertical:'center'},
           border:{bottom:{style:'medium',color:{rgb:C_MARINO}}}};
  }
  function numCell(bg,fg){
    return{font:{bold:true,color:{rgb:fg||'1E293B'},sz:10},
           fill:{fgColor:{rgb:bg||C_WHITE}},
           alignment:{horizontal:'right',vertical:'center'},
           border:{bottom:{style:'thin',color:{rgb:'E4E9F0'}},
                   right:{style:'thin',color:{rgb:'E4E9F0'}}}};
  }
  function totCell(){
    return{font:{bold:true,color:{rgb:C_WHITE},sz:11},
           fill:{fgColor:{rgb:C_MARINO}},
           alignment:{horizontal:'right',vertical:'center'}};
  }

  function applyStyle(ws, addr, style){
    if(!ws[addr]) ws[addr]={t:'s',v:''};
    ws[addr].s=style;
  }
  function setCellVal(ws, addr, val, style){
    const t=typeof val==='number'?'n':'s';
    ws[addr]={t,v:val};
    if(style) ws[addr].s=style;
  }

  // ════════════════════════════════════════════════════════
  // SHEET 1: RESUMEN

  ws1['!merges']=[

  setCellVal(ws1,'D5','',{fill:{fgColor:{rgb:C_MARINO}}});

  const cuotaRows=[
    ['Impuesto integrado','$'+fmt(cu.imp)],
    ...(c.sl==='Independiente'?[
      ['Jubilación','$'+fmt(cu.jub)],
      ['Obra social','$'+fmt(cu.os)],

    const r=r19+1+i;
    const bg=i%2===0?C_GRIS2:C_WHITE;
    setCellVal(ws1,`A${r}`,k,cell(true,C_GRIS,'475569'));
    setCellVal(ws1,`B${r}`,v,numCell(bg));
    ['C','D'].forEach(col=>setCellVal(ws1,col+r,'',{fill:{fgColor:{rgb:bg}}}));
  });
  // Total row
  const rTot=r19+1+cuotaRows.length;
  setCellVal(ws1,`A${rTot}`,'TOTAL A PAGAR / MES',totCell());
  setCellVal(ws1,`B${rTot}`,'$'+fmt(totM),totCell());
  ['C','D'].forEach(col=>setCellVal(ws1,col+rTot,'',{fill:{fgColor:{rgb:C_MARINO}}}));

  ws1['!cols']=[{wch:32},{wch:26},{wch:16},{wch:16}];
  ws1['!rows']=[];
  for(let i=0;i<40;i++) ws1['!rows'].push({hpt:18});
  ws1['!rows'][0]={hpt:28};
  ws1['!rows'][1]={hpt:20};

  XLSX.utils.book_append_sheet(wb,ws1,'Resumen');

  // ════════════════════════════════════════════════════════
  // SHEET 2: FACTURACIÓN MENSUAL
  // ════════════════════════════════════════════════════════
  const ws2={};
  const maxV2=Math.max(...arr,1);

  // Title
  for(let col of ['A','B','C','D']){
    setCellVal(ws2,col+'1','',{fill:{fgColor:{rgb:C_MARINO}}});
  }
  setCellVal(ws2,'A1',`FACTURACIÓN MENSUAL — ${c.n}`,titleCell());
  setCellVal(ws2,'A2',ci==='c1'?'Ciclo 1: Ene–Dic 2025':'Ciclo 2: Jul 25–Jun 26',subCell());
  ['B','C','D'].forEach(col=>{
    setCellVal(ws2,col+'1','',{fill:{fgColor:{rgb:C_MARINO}}});
    setCellVal(ws2,col+'2','',{fill:{fgColor:{rgb:C_MARINO}}});
  });

  // Headers
  ['A3','B3','C3','D3'].forEach((addr,i)=>{
    setCellVal(ws2,addr,['Mes','Facturación ($)','% del tope K','Estado'][i],hdr(C_CELESTE));
  });

  arr.forEach((v,i)=>{
    const r=4+i;
    const p=TK>0?v/TK:0;
    const bg=v===0?C_GRIS2:p>=0.08?C_RO:p>=0.05?C_AL:C_OK;
    const fg=v===0?'94A3B8':p>=0.08?C_RO_TXT:p>=0.05?C_AL_TXT:C_OK_TXT;
    const estado=v===0?'Sin datos':p>=0.08?'Alto':p>=0.05?'Medio':'Normal';
    setCellVal(ws2,`A${r}`,meses[i],cell(true,i%2===0?C_GRIS2:C_WHITE,'475569'));
    setCellVal(ws2,`C${r}`,+(p*100).toFixed(2),{...numCell(bg,fg),font:{bold:false,color:{rgb:fg},sz:10}});
    setCellVal(ws2,`D${r}`,estado,cell(false,bg,fg));
  });

  // Total row
  setCellVal(ws2,'A16','TOTAL',totCell());
  setCellVal(ws2,'B16',tot,totCell());
  setCellVal(ws2,'C16',+(pct*100).toFixed(2),totCell());
  setCellVal(ws2,'D16',s.l,{...totCell(),fill:{fgColor:{rgb:s.k==='ro'?'C62828':s.k==='al'?'E65100':'2E7D32'}}});

  ws2['!ref']='A1:D16';
  ws2['!cols']=[{wch:12},{wch:20},{wch:16},{wch:12}];
  ws2['!rows']=[];
  for(let i=0;i<16;i++) ws2['!rows'].push({hpt:20});
  ws2['!rows'][0]={hpt:28};
  ws2['!merges']=[
    {s:{r:0,c:0},e:{r:0,c:3}},
    {s:{r:1,c:0},e:{r:1,c:3}},
  ];
  XLSX.utils.book_append_sheet(wb,ws2,'Facturación mensual');

  // ════════════════════════════════════════════════════════
  // SHEET 3: ESCALAS 2026
  // ════════════════════════════════════════════════════════
  const ws3={};
  for(let col of ['A','B','C','D','E','F']){
    setCellVal(ws3,col+'1','',{fill:{fgColor:{rgb:C_MARINO}}});
  }
  setCellVal(ws3,'A1','ESCALAS MONOTRIBUTO 2026 — REFERENCIA',titleCell());
  setCellVal(ws3,'A2','Vigente desde febrero 2026 · Fuente: ARCA',subCell());
  ['B','C','D','E','F'].forEach(col=>{
    setCellVal(ws3,col+'1','',{fill:{fgColor:{rgb:C_MARINO}}});
    setCellVal(ws3,col+'2','',{fill:{fgColor:{rgb:C_MARINO}}});
  });

  const escHdrs=['Cat.','Tope Anual ($)','Cuota Indep. Serv.','Cuota Indep. Bienes','Cuota Dep. Serv.','Cuota Dep. Bienes'];
  escHdrs.forEach((h,i)=>{
    const addr=String.fromCharCode(65+i)+'3';
    setCellVal(ws3,addr,h,hdr(C_CELESTE));
  });

  CATS.forEach((cat,i)=>{
    const r=4+i;
    const isActive=cat.c===CATS[ci2].c;
    const bg=isActive?'EEF4FF':i%2===0?C_GRIS2:C_WHITE;
    const fg=isActive?'2563EB':'1E293B';
    const bold=isActive;
    setCellVal(ws3,`A${r}`,cat.c,cell(bold,bg,fg));
    [cat.t,cat.tis,cat.tib,cat.tds,cat.tdb].forEach((v,j)=>{
      setCellVal(ws3,String.fromCharCode(66+j)+r,v,{...numCell(bg,fg),font:{bold,color:{rgb:fg},sz:10}});
    });
  });

  ws3['!ref']='A1:F14';
  ws3['!cols']=[{wch:8},{wch:20},{wch:20},{wch:20},{wch:18},{wch:18}];
  ws3['!rows']=[];
  for(let i=0;i<14;i++) ws3['!rows'].push({hpt:20});
  ws3['!rows'][0]={hpt:28};
  ws3['!merges']=[
    {s:{r:0,c:0},e:{r:0,c:5}},
    {s:{r:1,c:0},e:{r:1,c:5}},
  ];
  XLSX.utils.book_append_sheet(wb,ws3,'Escalas 2026');

  XLSX.writeFile(wb,`Zuma_${c.n.replace(/\s+/g,'_')}_${fecha}.xlsx`);
}

function onGroupChange(){
  updateGroupExportBtn();
  render();
}

function updateGroupExportBtn(){
  const btn=document.getElementById('btn-group-pdf');
  if(!btn) return;
  const g=(document.getElementById('fg')||{}).value||'';
  if(g && g!==''){
    btn.disabled=false;
    btn.style.opacity='1';
    btn.style.cursor='pointer';
    btn.title='Exportar reporte del grupo '+g;
  } else {
    btn.disabled=true;
    btn.style.opacity='0.5';
    btn.style.cursor='not-allowed';
    btn.title='Seleccioná un grupo para exportar';
  }
}

function exportGroupPDF(){
  const g=(document.getElementById('fg')||{}).value||'';
  if(!g){ alert('Seleccioná un grupo primero.'); return; }
  const clientes=CL.filter(c=>c.g===g).slice().sort((a,b)=>a.n.localeCompare(b.n,'es'));
  if(clientes.length===0){ alert('No hay clientes en el grupo '+g); return; }

  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth();
  const H=doc.internal.pageSize.getHeight();
  const marL=10, marR=10;
  const meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const now=new Date();
  const fechaStr=`${meses[now.getMonth()]} ${now.getFullYear()}`;
  const fechaFile=`${meses[now.getMonth()]}${now.getFullYear()}`;

  // Header navy
  doc.setFillColor(11,42,79);
  doc.rect(0,0,W,22,'F');
  doc.setTextColor(255,255,255);
  // Logo (white version): drawn from the nav <img> with brightness/invert filter
  try{
    const navImg=document.querySelector('.nav img');
    if(navImg && navImg.complete){
      const cv=document.createElement('canvas');
      const ratio=navImg.naturalWidth/navImg.naturalHeight;
      cv.width=600;cv.height=Math.round(600/ratio);
      const ctx=cv.getContext('2d');
      ctx.filter='brightness(0) invert(1)';
      ctx.drawImage(navImg,0,0,cv.width,cv.height);
      const logoData=cv.toDataURL('image/png');
      const logoH=8, logoW=logoH*ratio;
      doc.addImage(logoData,'PNG',marL,7,logoW,logoH);
    } else {
      doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('ZUMA+',marL,13);
    }
  }catch(_){doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('ZUMA+',marL,13);}
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.text('Reporte de grupo',marL,19);
  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.text(g,W/2,13,{align:'center'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.text(fechaStr,W-marR,13,{align:'right'});
  doc.text(`${clientes.length} cliente${clientes.length===1?'':'s'}`,W-marR,19,{align:'right'});

  // Column definitions
  const ciHdr=resolveCiclo((document.getElementById('fc')||{}).value||'auto');
  const cicloLbl=ciHdr==='c1'?'ene 25 - dic 25':'jul 25 - jun 26';
  const headers=['Nombre','Grupo','Cat.','% Tope RS (12M)','Total '+cicloLbl+' ($)','% Tope K (ciclo)','Estado','Cuota mensual ($)'];
  // Nota: ampliamos la columna 'Estado' para que quepa el chip 'Supera Cat X -> Y' cuando corresponda.
  const widths=[42,24,12,26,38,24,55,37];
  const totalW=widths.reduce((a,b)=>a+b,0);
  const startX=marL;

  let y=32;
  const drawHeader=()=>{
    doc.setFillColor(11,42,79);
    doc.rect(startX,y,totalW,8,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(8);
    let x=startX;
    headers.forEach((h,i)=>{
      doc.text(h,x+2,y+5.2);
      x+=widths[i];
    });
    y+=8;
  };
  drawHeader();

  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  const rowH=7;
  const fmtAR=v=>{
    if(!isFinite(v)||v==null) return '—';
    return '$'+Math.round(v).toLocaleString('es-AR');
  };
  const fmtPct=v=>{
    if(!isFinite(v)||v==null) return '—';
    return (v*100).toFixed(1)+'%';
  };

  clientes.forEach((c,idx)=>{
    if(y+rowH>H-12){
      doc.addPage();
      y=12;
      drawHeader();
    }
    // Compute per-client figures using existing helpers
    const ciRaw=(document.getElementById('fc')||{}).value||'auto';
    const ci=resolveCiclo(ciRaw);
    const arr=c[ci]||[];
    const miss=(ci==='c1'?c.m1:c.m2)||[];
    const tot=arr.reduce((s,v)=>s+(+v||0),0);
    const pctK=TK>0?tot/TK:0;
    const inc=gInc(arr,miss,ci);
    const s=gS(pctK,inc,gNd(miss,ci));
    // Categoría: usar la asignada en CLIENTES (col E) si existe; si no, la auto calculada.
    const autoIdx=gCi(tot);
    const cSheet=gCiByName(c.catSheet);
    const catIdx=cSheet>-1?cSheet:autoIdx;
    const cat=(CATS[catIdx]&&CATS[catIdx].c)||'—';
    // Cuota mensual: misma fórmula que el detalle individual (TOTAL/MES = Imp + Jub + OS + IIBB, según situación laboral y adherentes OS)
    const cuota=gTotMes(c,catIdx);
    // Supera su categoría actual: total del ciclo > tope de su cat. asignada (col M).
    // X = cat actual (col E); Y = primera cat cuyo tope es mayor al total (auto).
    const superaCat=cSheet>-1&&cSheet<autoIdx;
    const catSupX=cSheet>-1?((CATS[cSheet]&&CATS[cSheet].c)||c.catSheet):'';
    const catSupY=superaCat?((CATS[autoIdx]&&CATS[autoIdx].c)||''):'';
    const p12=+c.pct12m||0;
    const sem12=sem12k(c.sem12||c.sem12m||'');

    // Zebra
    if(idx%2===0){
      doc.setFillColor(248,250,252);
      doc.rect(startX,y,totalW,rowH,'F');
    }

    doc.setTextColor(30,41,59);
    let x=startX;
    const cells=[
      {t:c.n||'—',a:'left'},
      {t:c.g||'—',a:'left'},
      {t:cat,a:'center'},
      {t:fmtPct(p12),a:'right',bg:sem12},
      {t:fmtAR(tot),a:'right'},
      {t:fmtPct(pctK),a:'right'},
      {t:s.l||'—',a:'center',bg:s.k,estado:true},
      {t:fmtAR(cuota),a:'right'},
    ];
    cells.forEach((cell,i)=>{
      const w=widths[i];
      if(cell.estado){
        // Columna 'Estado' compuesta: chip del semáforo + (opcional) badge rojo 'Supera Cat X -> Y'
        const semRgb=cell.bg==='ro'?[254,226,226]:cell.bg==='al'?[254,243,199]:[220,252,231];
        const semTc =cell.bg==='ro'?[153,27,27] :cell.bg==='al'?[146,64,14] :[22,101,52];
        const semW=18;
        doc.setFillColor(semRgb[0],semRgb[1],semRgb[2]);
        doc.rect(x+1,y+1,semW-2,rowH-2,'F');
        doc.setTextColor(semTc[0],semTc[1],semTc[2]);
        doc.setFont('helvetica','bold');
        doc.setFontSize(8);
        doc.text(String(cell.t||'—'),x+semW/2,y+rowH-2.2,{align:'center'});
        if(superaCat && catSupX && catSupY){
          const bxStart=x+semW+1;
          const bxMaxW=w-semW-2;
          let bxLabel='Supera Cat. '+catSupX+' → '+catSupY;
          let fs=8;
          doc.setFont('helvetica','bold');
          doc.setFontSize(fs);
          // Reducir font-size del badge antes de romper el layout si hace overflow
          while(doc.getTextWidth(bxLabel)>bxMaxW-4 && fs>6){fs-=0.5;doc.setFontSize(fs);}
          if(doc.getTextWidth(bxLabel)>bxMaxW-4){
            bxLabel='Sup. Cat. '+catSupX+' → '+catSupY;
            while(doc.getTextWidth(bxLabel)>bxMaxW-4 && fs>6){fs-=0.5;doc.setFontSize(fs);}
          }
          const bxW=Math.min(doc.getTextWidth(bxLabel)+6,bxMaxW);
          doc.setFillColor(254,226,226); // #FEE2E2
          doc.rect(bxStart,y+1,bxW,rowH-2,'F');
          doc.setTextColor(185,28,28); // #B91C1C
          doc.text(bxLabel,bxStart+bxW/2,y+rowH-2.2,{align:'center'});
          doc.setFontSize(8);
        }
        doc.setTextColor(30,41,59);
        doc.setFont('helvetica','normal');
        x+=w;
        return;
      }
      if(cell.bg){
        const rgb=cell.bg==='ro'?[254,226,226]:cell.bg==='al'?[254,243,199]:[220,252,231];
        doc.setFillColor(rgb[0],rgb[1],rgb[2]);
        doc.rect(x+1,y+1,w-2,rowH-2,'F');
        const tc=cell.bg==='ro'?[153,27,27]:cell.bg==='al'?[146,64,14]:[22,101,52];
        doc.setTextColor(tc[0],tc[1],tc[2]);
        doc.setFont('helvetica','bold');
      } else {
        doc.setTextColor(30,41,59);
        doc.setFont('helvetica','normal');
      }
      const tx=cell.a==='right'?x+w-2:cell.a==='center'?x+w/2:x+2;
      const txt=String(cell.t).length>30?String(cell.t).substring(0,28)+'…':String(cell.t);
      doc.text(txt,tx,y+rowH-2.2,{align:cell.a});
      x+=w;
    });
    doc.setDrawColor(226,232,240);
    doc.setLineWidth(0.1);
    doc.line(startX,y+rowH,startX+totalW,y+rowH);
    y+=rowH;
  });

  // Sección 'REFERENCIAS Y ACLARACIONES' al pie
  (function drawRefs(){
    const refW=W-marL-marR;
    const refs=[
      {lbl:'% Tope RS (12M):',txt:' porcentaje acumulado de facturación de los últimos 12 meses corridos sobre el tope del Régimen Simplificado (Cat. K).'},
      {lbl:'% Tope K (ciclo):',txt:' porcentaje acumulado del ciclo actual (Ene–Dic o Jul–Jun según corresponda) sobre el tope de Cat. K.'},
      {lbl:'Supera Cat. X:',txt:' indica que el cliente, con la facturación del ciclo actual, ya superó el tope de su categoría vigente y deberá recategorizarse en el próximo período. La categoría sugerida puede variar al momento efectivo de la recategorización por la actualización de las escalas.'},
      {lbl:'',italic:true,txt:'Estos informes toman como referencia las escalas corrientes sin actualización, por lo que son a modo orientativo. Los topes de las categorías se ajustan por IPC al momento de la recategorización en forma semestral.'}
    ];
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    // Estimar alto
    let estH=9;
    refs.forEach(r=>{
      const lines=doc.splitTextToSize((r.lbl?r.lbl:'')+r.txt,refW);
      estH+=lines.length*3.6+1.5;
    });
    if(y+8+estH>H-12){doc.addPage();y=14;} else {y+=5;}
    doc.setDrawColor(205,212,223);
    doc.setLineWidth(0.2);
    doc.line(marL,y,W-marR,y);
    y+=5;
    doc.setFont('helvetica','bold');
    doc.setFontSize(10);
    doc.setTextColor(66,74,81);
    doc.text('REFERENCIAS Y ACLARACIONES',marL,y);
    y+=5;
    doc.setFontSize(9);
    doc.setTextColor(90,100,114);
    refs.forEach(r=>{
      doc.setFont('helvetica',r.italic?'italic':'normal');
      if(r.lbl && !r.italic){
        doc.setFont('helvetica','bold');
        doc.text(r.lbl,marL,y);
        const lblW=doc.getTextWidth(r.lbl);
        doc.setFont('helvetica','normal');
        const rest=r.txt.replace(/^\s+/,' ');
        const availW=refW-lblW;
        const first=doc.splitTextToSize(rest,availW);
        if(first.length){doc.text(first[0],marL+lblW,y);}
        y+=3.6;
        if(first.length>1){
          const extra=first.slice(1);
          extra.forEach(l=>{doc.text(l,marL,y);y+=3.6;});
        }
      } else {
        const lines=doc.splitTextToSize(r.txt,refW);
        lines.forEach(l=>{doc.text(l,marL,y);y+=3.6;});
      }
      y+=1.2;
    });
  })();

  // Footer: page numbers
  const pgs=doc.getNumberOfPages();
  for(let i=1;i<=pgs;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal');
    doc.setFontSize(7);
    doc.setTextColor(148,163,184);
    doc.text('Pagina '+i+' de '+pgs+' \u00B7 Generado '+fechaStr+' \u00B7 ZUMA+ Monitor Monotributistas',W/2,H-6,{align:'center'});
  }

  doc.save('Zuma_Grupo_'+g.replace(/\s+/g,'_')+'_'+fechaFile+'.pdf');
}
