<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuma — Monitor Monotributistas</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --marino:#0E1A2C;--celeste:#3E8CFF;--cielo:#A0C8F3;
  --graffito:#424A51;--gris:#E8EBF1;
  --ok-bg:#E8F5E9;--ok-txt:#1B5E20;--ok-bar:#2E7D32;
  --al-bg:#FFF8E1;--al-txt:#E65100;--al-bar:#F57C00;
  --ro-bg:#FFEBEE;--ro-txt:#B71C1C;--ro-bar:#C62828;
  --inc-bg:#EDE7F6;--inc-txt:#4527A0;
  --border:#DDE2EA;--bg:#F4F6F9;
}
body{font-family:'Roboto',sans-serif;background:var(--bg);color:var(--marino);font-size:13px}

/* LOADING */
.ls{position:fixed;inset:0;background:var(--marino);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity 0.5s}
.ls.hidden{opacity:0;pointer-events:none}
.ll{color:#fff;font-size:48px;font-weight:700;letter-spacing:4px;margin-bottom:24px}
.ll span{color:var(--celeste)}
.lbw{width:200px;height:3px;background:rgba(255,255,255,0.15);border-radius:2px}
.lb{height:3px;background:var(--celeste);border-radius:2px;width:0;transition:width 0.3s}
.lt{color:rgba(255,255,255,0.4);font-size:11px;margin-top:12px}

.err{background:#FFEBEE;border-left:3px solid var(--ro-bar);padding:10px 20px;color:var(--ro-txt);font-size:12px;display:none}

/* NAVBAR */
.nav{background:var(--marino);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--celeste);position:sticky;top:0;z-index:100}
.nav-l{display:flex;align-items:center;gap:10px}
.lz{width:32px;height:32px;background:var(--celeste);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff}
.lw{color:#fff;font-size:16px;font-weight:300;letter-spacing:2px}
.nd{width:1px;height:18px;background:rgba(255,255,255,0.2);margin:0 6px}
.nm{color:rgba(255,255,255,0.4);font-size:11px}
.nav-r{display:flex;align-items:center;gap:10px}
.upd{text-align:right}
.upd-l{color:rgba(255,255,255,0.4);font-size:9px;letter-spacing:0.5px;text-transform:uppercase}
.upd-v{color:var(--cielo);font-size:11px;margin-top:1px}
.rbtn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);padding:5px 12px;border-radius:4px;font-size:11px;cursor:pointer;font-family:'Roboto',sans-serif}
.rbtn:hover{background:rgba(255,255,255,0.15);color:#fff}

/* TOOLBAR */
.tb{background:#132338;border-bottom:1px solid rgba(255,255,255,0.07);padding:8px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tg{display:flex;align-items:center;gap:5px}
.tg label{color:rgba(255,255,255,0.4);font-size:10px;font-weight:500;letter-spacing:0.6px;text-transform:uppercase;white-space:nowrap}
.tb select,.tb input{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:4px;color:#fff;font-size:12px;padding:5px 8px;font-family:'Roboto',sans-serif;outline:none}
.tb select:focus,.tb input:focus{border-color:var(--celeste)}
.tb select option{background:#132338}
.tb input::placeholder{color:rgba(255,255,255,0.25)}
.tb-r{margin-left:auto;color:rgba(255,255,255,0.35);font-size:11px}

/* CICLO BADGE en toolbar */
.ciclo-badge{background:rgba(62,140,255,0.2);border:1px solid rgba(62,140,255,0.4);color:var(--cielo);padding:3px 10px;border-radius:4px;font-size:11px;font-weight:500}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
.stat{background:#fff;padding:12px 16px;border-right:1px solid var(--border);text-align:center}
.stat:last-child{border-right:none}
.sn{font-size:28px;font-weight:700;color:var(--marino);line-height:1}
.sl{font-size:10px;color:var(--graffito);margin-top:3px;font-weight:500;letter-spacing:0.4px;text-transform:uppercase}
.stat.ok .sn{color:#2E7D32}.stat.al .sn{color:#E65100}.stat.ro .sn{color:#C62828}

/* TABLE */
.tw{background:#fff;overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead tr{background:var(--gris);border-bottom:2px solid #CDD2DC}
th{padding:8px 12px;text-align:left;font-weight:500;font-size:10px;color:var(--graffito);letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;user-select:none;overflow:hidden}
th:hover{color:var(--marino)}
th.asc::after{content:' ↑'}th.desc::after{content:' ↓'}
td{padding:8px 12px;border-bottom:1px solid #F0F2F5;vertical-align:middle;overflow:hidden}
tr:hover td{background:#F7F9FD;cursor:pointer}

/* Column widths */
th:nth-child(1),td:nth-child(1){width:30%}
th:nth-child(2),td:nth-child(2){width:13%}
th:nth-child(3),td:nth-child(3){width:6%;text-align:center}
th:nth-child(4),td:nth-child(4){width:14%;text-align:right}
th:nth-child(5),td:nth-child(5){width:8%;text-align:right}
th:nth-child(6),td:nth-child(6){width:16%}
th:nth-child(7),td:nth-child(7){width:13%}

.nd2{padding:50px;text-align:center;color:var(--graffito)}

/* CLIENT NAME CELL */
.cn{font-weight:500;font-size:12px;color:var(--marino);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpct{font-size:9px;color:var(--graffito);margin-top:2px}
.mbw{display:flex;align-items:center;gap:4px;margin-top:2px}
.mbb{flex:1;max-width:100px;height:2px;background:var(--border);border-radius:1px}
.mbf{height:2px;border-radius:1px}
.mpt{font-size:9px;color:var(--graffito);flex-shrink:0}

/* BADGES */
.bcat{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:700;background:var(--marino);color:#fff;min-width:22px;text-align:center}
.bgrp{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;background:#EEF4FF;color:var(--celeste);font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bsem{display:inline-block;padding:3px 8px;border-radius:3px;font-size:10px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok-txt)}
.al{background:var(--al-bg);color:var(--al-txt)}
.ro{background:var(--ro-bg);color:var(--ro-txt)}
.inc{background:var(--inc-bg);color:var(--inc-txt)}
.nd3{background:var(--gris);color:var(--graffito)}

.total-val{font-weight:600;font-size:12px}
.pct-val{font-weight:600;font-size:12px}

.vb{padding:3px 8px;font-size:10px;border:1px solid var(--celeste);border-radius:3px;background:#fff;color:var(--celeste);cursor:pointer;font-family:'Roboto',sans-serif;font-weight:500;white-space:nowrap}
.vb:hover{background:#EEF4FF}

/* DETAIL PANEL */
.dp{background:#fff;border-top:3px solid var(--celeste);display:none}
.dph{background:var(--marino);padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.dph h2{color:#fff;font-size:15px;font-weight:500;margin-bottom:5px}
.dpm{display:flex;gap:5px;flex-wrap:wrap}
.dpb{padding:16px 20px}
.c4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.dc{background:var(--gris);border-radius:6px;padding:10px 12px}
.dc.dark{background:var(--marino)}
.dcl{font-size:9px;font-weight:600;color:var(--graffito);letter-spacing:0.4px;text-transform:uppercase;margin-bottom:4px}
.dc.dark .dcl{color:var(--cielo)}
.dcv{font-size:18px;font-weight:700;color:var(--marino);line-height:1}
.dc.dark .dcv{color:#fff;font-size:22px}
.dcs{font-size:10px;color:var(--graffito);margin-top:2px}
.dc.dark .dcs{color:rgba(255,255,255,0.4)}
.prog{margin:8px 0}
.prgh{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.prgh span{font-size:10px;color:var(--graffito)}.prgh strong{font-size:11px;color:var(--marino)}
.prgt{height:6px;background:var(--gris);border-radius:3px;overflow:hidden}
.prgf{height:6px;border-radius:3px}
.stl{font-size:10px;font-weight:600;color:var(--graffito);letter-spacing:0.5px;text-transform:uppercase;margin:12px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.cbox{border:1px solid var(--border);border-radius:6px;padding:10px 12px}
.cbox.nx{border-color:var(--celeste);background:#F5F9FF}
.cbt{font-size:9px;font-weight:600;color:var(--graffito);letter-spacing:0.4px;text-transform:uppercase;margin-bottom:6px}
.cbcat{font-size:24px;font-weight:700;color:var(--marino);margin-bottom:2px}
.cbox.nx .cbcat{color:var(--celeste)}
.cbl{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #F0F2F5;font-size:11px}
.cbl:last-of-type{border-bottom:none}
.cbn{color:var(--graffito)}.cba{font-weight:500;color:var(--marino)}
.cbtot{display:flex;justify-content:space-between;padding:5px 0 2px;margin-top:3px;border-top:2px solid var(--border)}
.cbtot .cbn{font-weight:600;font-size:12px;color:var(--marino)}
.cbtot .cba{font-weight:700;font-size:13px;color:var(--celeste)}
.cbiibb{margin-top:6px;padding:5px 8px;background:var(--gris);border-radius:3px;display:flex;justify-content:space-between;font-size:11px}
.cbgrand{margin-top:4px;padding:7px;background:var(--marino);border-radius:4px;display:flex;justify-content:space-between}
.cbgrand .cbn{color:rgba(255,255,255,0.6);font-size:11px;font-weight:600}
.cbgrand .cba{color:#fff;font-size:13px;font-weight:700}
.mg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:12px}
.mc{border-radius:4px;padding:6px 3px;text-align:center}
.mc.ok-m{background:#EAF3DE}
.mc.zero-m{background:var(--gris)}
.mc.miss-m{background:#EDE7F6}
.mn2{font-size:9px;color:var(--graffito);font-weight:500;margin-bottom:2px}
.mv{font-size:10px;font-weight:600;color:var(--marino)}
.mc.zero-m .mv{color:#B0B8C4}
.mc.miss-m .mv{color:var(--inc-txt);font-size:9px}
.mb2{height:2px;border-radius:1px;margin-top:3px}
.dpacts{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.bp{padding:7px 14px;font-size:11px;background:var(--marino);color:#fff;border:none;border-radius:4px;cursor:pointer;font-family:'Roboto',sans-serif;font-weight:500}
.bp:hover{background:#1a2d4a}
.bsec{padding:7px 14px;font-size:11px;background:#fff;color:var(--marino);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-family:'Roboto',sans-serif}
.bcl{padding:7px 12px;font-size:11px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.15);border-radius:4px;cursor:pointer;font-family:'Roboto',sans-serif}

@media(max-width:900px){
  th:nth-child(1),td:nth-child(1){width:auto}
  .c4{grid-template-columns:1fr 1fr}.c2{grid-template-columns:1fr}
  .mg{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){.mg{grid-template-columns:repeat(3,1fr)}}
@media print{.nav,.tb,.stats,.tw,.dpacts{display:none}.dp{display:block!important;border:none}.dph{background:#0E1A2C!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>

<div class="ls" id="loading">
  <div class="ll">z<span>+</span></div>
  <div class="lbw"><div class="lb" id="lbar"></div></div>
  <div class="lt" id="ltxt">Conectando con el Sheets...</div>
</div>
<div class="err" id="err"></div>

<div class="nav">
  <div class="nav-l">
    <div class="lz">Z</div>
    <span class="lw">zuma</span>
    <div class="nd"></div>
    <span class="nm">Monitor Monotributistas</span>
  </div>
  <div class="nav-r">
    <div class="upd">
      <div class="upd-l">Última actualización</div>
      <div class="upd-v" id="lupd">—</div>
    </div>
    <button class="rbtn" onclick="loadAll()">↻ Actualizar</button>
  </div>
</div>

<div class="tb">
  <div class="tg"><label>Grupo</label>
    <select id="fg" onchange="render()"><option value="">Todos</option></select></div>
  <div class="tg"><label>Ciclo</label>
    <select id="fc" onchange="onCicloChange()">
      <option value="c1">Ciclo 1 — Ene/Dic 2025</option>
      <option value="c2" selected>Ciclo 2 — Jul 25/Jun 26</option>
    </select></div>
  <span class="ciclo-badge" id="ciclo-label">Jul-25 → Jun-26</span>
  <div class="tg"><label>Estado</label>
    <select id="fs" onchange="render()">
      <option value="">Todos</option>
      <option value="ok">OK</option>
      <option value="al">Alerta</option>
      <option value="ro">Rojo</option>
      <option value="inc">Incompleto</option>
      <option value="nd3">Sin datos</option>
    </select></div>
  <div class="tg">
    <input type="text" id="fq" placeholder="Buscar cliente..." oninput="render()" style="min-width:160px"></div>
  <div class="tb-r" id="tcnt"></div>
</div>

<div class="stats">
  <div class="stat"><div class="sn" id="st">—</div><div class="sl">Total clientes</div></div>
  <div class="stat ok"><div class="sn" id="so">—</div><div class="sl">OK</div></div>
  <div class="stat al"><div class="sn" id="sa">—</div><div class="sl">Alerta</div></div>
  <div class="stat ro"><div class="sn" id="sr">—</div><div class="sl">Rojo</div></div>
</div>

<div class="tw">
  <table>
    <thead><tr>
      <th id="thn" onclick="sortBy('n')">Cliente</th>
      <th id="thg" onclick="sortBy('g')">Grupo</th>
      <th id="thc" onclick="sortBy('c')" style="text-align:center">Cat.</th>
      <th id="tht" onclick="sortBy('t')" style="text-align:right">Total <span id="th-ciclo-lbl">Jul–Jun</span></th>
      <th id="thp" onclick="sortBy('p')" style="text-align:right">% Tope K</th>
      <th>Estado</th>
      <th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="dp" id="dp"></div>

<script>
const PUB='2PACX-1vTImQOlHnK1PHaxRg8oXD7pBwmDHrOEGmK54dhWj5PF9KNTSqFViwTz1ncKBoLSkjx36vXQj94rbrwK';
const GIDS={TOPES:'2112531242',IIBB:'1006339578',CICLO1:'234483374',CICLO2:'1539371977',CLIENTES:'1819856991'};
const M1=['Ene-25','Feb-25','Mar-25','Abr-25','May-25','Jun-25','Jul-25','Ago-25','Sep-25','Oct-25','Nov-25','Dic-25'];
const M2=['Jul-25','Ago-25','Sep-25','Oct-25','Nov-25','Dic-25','Ene-26','Feb-26','Mar-26','Abr-26','May-26','Jun-26'];
// Which months are "past" (should have data) vs future for each ciclo
// Ciclo 2 Jul25-Jun26: as of Mar 2026, months 0-8 (Jul25-Mar26) should have data
const PAST_C1 = 12; // all months of 2025 are past
const PAST_C2 = 9;  // Jul25 to Mar26 = 9 months past

let CATS=[],IIBB_C=[],IIBB_AS=[],IIBB_AB=[],CLIENTS=[],C1={},C2={},TOPE_K=108357084.05;
let sc='t',sd=-1,sel=null;

function csvUrl(gid){return`https://docs.google.com/spreadsheets/d/e/${PUB}/pub?gid=${gid}&single=true&output=csv`;}

function parseCSV(txt){
  const rows=[];
  const lines=txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  for(const line of lines){
    if(!line.trim()) continue;
    const cells=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      if(line[i]==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(line[i]===','&&!inQ){cells.push(cur.trim());cur='';}
      else cur+=line[i];
    }
    cells.push(cur.trim());
    rows.push(cells);
  }
  return rows;
}

// Parse Argentine number format: $1.978.750 → 1978750
function n(v){
  v=String(v||'').trim().replace(/^"|"$/g,'');
  if(!v||v==='-'||v.toUpperCase()==='NAN'||v==='#N/A') return 0;
  // Remove $, spaces, then replace dots (thousands sep) and comma (decimal sep)
  v=v.replace(/\$/g,'').replace(/\s/g,'').replace(/%/g,'');
  // AR format: 1.978.750 → remove dots, keep as integer
  // Check if it looks like AR format (multiple dots or dot then 3 digits at end)
  if(/^\d{1,3}(\.\d{3})+$/.test(v)){
    v=v.replace(/\./g,''); // remove thousand separators
  } else {
    // Could have comma as decimal: 22,7 → 22.7
    v=v.replace(/\./g,'').replace(',','.');
  }
  const x=parseFloat(v);
  return isNaN(x)?0:x;
}

// Check if a cell is truly empty/missing vs zero
function isEmpty(v){
  v=String(v||'').trim().replace(/^"|"$/g,'');
  return !v||v===''||v==='nan';
}
function cl(v){return String(v||'').trim().replace(/^"|"$/g,'');}

async function fetchCSV(gid){
  const r=await fetch(csvUrl(gid));
  if(!r.ok) throw new Error('HTTP '+r.status);
  return parseCSV(await r.text());
}

async function loadTopes(){
  const rows=await fetchCSV(GIDS.TOPES);
  CATS=[];
  for(const row of rows){
    const c=cl(row[0]);
    if(!'ABCDEFGHIJK'.includes(c)||c.length!==1) continue;
    CATS.push({c,t:n(row[1]),is:n(row[4]),ib:n(row[5]),j:n(row[6]),os:n(row[7]),tis:n(row[8]),tib:n(row[9]),tds:n(row[10]),tdb:n(row[11])});
  }
  if(CATS.length) TOPE_K=CATS[CATS.length-1].t;
}

async function loadIIBB(){
  const rows=await fetchCSV(GIDS.IIBB);
  IIBB_C=[];IIBB_AS=[];IIBB_AB=[];
  let sec='';
  for(const row of rows){
    const f=cl(row[0]).toUpperCase();
    if(f.includes('AGIP')){sec='C';continue;}
    if(f.includes('ARBA')){sec='A';continue;}
    const c=cl(row[0]);
    if(!'ABCDEFGHIJK'.includes(c)||c.length!==1) continue;
    if(sec==='C') IIBB_C.push(n(row[2]));
    if(sec==='A'){IIBB_AS.push(n(row[2]));IIBB_AB.push(n(row[3]));}
  }
}

async function loadCiclo(gid){
  const rows=await fetchCSV(gid);
  const data={};
  // Find header row containing 'CLIENTE'
  let hi=-1;
  for(let i=0;i<rows.length;i++){
    for(let j=0;j<rows[i].length;j++){
      if(cl(rows[i][j]).toUpperCase()==='CLIENTE'){hi=i;break;}
    }
    if(hi>-1) break;
  }
  if(hi===-1) return data;
  const hdr=rows[hi].map(h=>cl(h).toUpperCase());
  const iName=hdr.indexOf('CLIENTE');
  // Find first month column
  let iStart=-1;
  for(let j=0;j<hdr.length;j++){
    if(/^(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)/.test(hdr[j])){iStart=j;break;}
  }
  if(iName===-1||iStart===-1) return data;

  for(let i=hi+1;i<rows.length;i++){
    const row=rows[i];
    const name=cl(row[iName]);
    if(!name||name.toUpperCase()==='CLIENTE') continue;
    // Store both value and emptiness for each month
    const months=[],missing=[];
    for(let j=iStart;j<iStart+12;j++){
      const raw=j<row.length?row[j]:'';
      missing.push(isEmpty(raw));
      months.push(n(raw));
    }
    while(months.length<12){months.push(0);missing.push(true);}
    data[name]={months,missing};
  }
  return data;
}

async function loadClientes(){
  const rows=await fetchCSV(GIDS.CLIENTES);
  CLIENTS=[];
  let hi=-1;
  for(let i=0;i<rows.length;i++){
    for(let j=0;j<rows[i].length;j++){
      if(cl(rows[i][j]).toUpperCase()==='NOMBRE'){hi=i;break;}
    }
    if(hi>-1) break;
  }
  if(hi===-1) return;
  const hdr=rows[hi].map(h=>cl(h).toUpperCase());
  const iN=hdr.indexOf('NOMBRE'),iG=hdr.indexOf('GRUPO');
  const iA=hdr.indexOf('ACTIVIDAD'),iSL=hdr.indexOf('SITUACION LABORAL');
  const iIB=hdr.indexOf('REGIMEN IIBB'),iEst=hdr.indexOf('ESTADO');

  for(let i=hi+1;i<rows.length;i++){
    const row=rows[i];
    const name=cl(row[iN>-1?iN:1]);
    if(!name||name.toUpperCase()==='NOMBRE') continue;
    const estado=cl(row[iEst>-1?iEst:14]).toUpperCase();
    if(estado==='BAJA') continue;
    CLIENTS.push({
      n:name,g:cl(row[iG>-1?iG:2])||'INDIVIDUAL',
      a:cl(row[iA>-1?iA:5])||'Servicios',
      sl:cl(row[iSL>-1?iSL:6])||'Independiente',
      iibb:cl(row[iIB>-1?iIB:7])||'Exento',
    });
  }
}

async function loadAll(){
  const btn=document.querySelector('.rbtn');
  if(btn)btn.textContent='↻';
  setLoad(true);
  try{
    prog(10,'Cargando escalas...');await loadTopes();
    prog(30,'Cargando IIBB...');await loadIIBB();
    prog(50,'Cargando Ciclo 1...');C1=await loadCiclo(GIDS.CICLO1);
    prog(70,'Cargando Ciclo 2...');C2=await loadCiclo(GIDS.CICLO2);
    prog(85,'Cargando clientes...');await loadClientes();
    prog(100,'Listo');

    CLIENTS.forEach(c=>{
      const d1=C1[c.n]||{months:new Array(12).fill(0),missing:new Array(12).fill(true)};
      const d2=C2[c.n]||{months:new Array(12).fill(0),missing:new Array(12).fill(true)};
      c.c1=d1.months; c.m1=d1.missing;
      c.c2=d2.months; c.m2=d2.missing;
    });

    // Populate grupo filter
    const sel=document.getElementById('fg');
    const exist=[...sel.options].map(o=>o.value);
    [...new Set(CLIENTS.map(c=>c.g))].sort().forEach(g=>{
      if(!exist.includes(g)){const o=document.createElement('option');o.value=g;o.textContent=g;sel.appendChild(o);}
    });

    const now=new Date();
    document.getElementById('lupd').textContent=
      now.toLocaleDateString('es-AR')+' '+now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+
      ' · Tope K: $'+fmt(TOPE_K);
    hideErr();render();
    setTimeout(()=>setLoad(false),400);
  }catch(e){
    showErr('Error al conectar con el Sheets: '+e.message);
    setLoad(false);
  }
  if(btn)btn.textContent='↻ Actualizar';
}

function setLoad(v){const e=document.getElementById('loading');if(v)e.classList.remove('hidden');else e.classList.add('hidden');}
function prog(p,t){document.getElementById('lbar').style.width=p+'%';document.getElementById('ltxt').textContent=t;}
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.style.display='block';}
function hideErr(){document.getElementById('err').style.display='none';}

function onCicloChange(){
  const ci=document.getElementById('fc').value;
  document.getElementById('ciclo-label').textContent=ci==='c1'?'Ene-25 → Dic-25':'Jul-25 → Jun-26';
  document.getElementById('th-ciclo-lbl').textContent=ci==='c1'?'Ene–Dic':'Jul–Jun';
  render();
}

function getCi(t){for(let i=0;i<CATS.length;i++)if(t<=CATS[i].t)return i;return CATS.length-1;}
function getSem(p,isInc){
  if(isInc) return{k:'inc',l:'Incompleto'};
  if(p===0) return{k:'nd3',l:'Sin datos'};
  if(p>=0.8) return{k:'ro',l:'Rojo'};
  if(p>=0.5) return{k:'al',l:'Alerta'};
  return{k:'ok',l:'OK'};
}
function fmt(v){return Math.round(v).toLocaleString('es-AR');}
function fmtk(v){if(v>=1000000)return(v/1000000).toFixed(1)+'M';if(v>=1000)return(v/1000).toFixed(0)+'k';return Math.round(v).toString();}
function fmtp(p){return(p*100).toFixed(1)+'%';}
function bcolor(k){return k==='ro'?'#C62828':k==='al'?'#F57C00':k==='ok'?'#2E7D32':k==='inc'?'#4527A0':'#B0B8C4';}

function isIncomplete(months, missing, ciclo){
  const pastCount = ciclo==='c1'?PAST_C1:PAST_C2;
  for(let i=0;i<pastCount;i++){
    if(missing[i]) return true;
  }
  return false;
}

function getIIBB(c,ci){
  if(c.iibb==='Exento') return 0;
  if(c.iibb.includes('Convenio')) return null;
  if(c.iibb.includes('CABA')) return IIBB_C[ci]||0;
  if(c.iibb.includes('BsAs')||c.iibb.includes('Buenos')){
    return c.a==='Venta de Bienes'?(IIBB_AB[ci]||0):(IIBB_AS[ci]||0);
  }
  return 0;
}
function getCuota(c,ci){
  if(!CATS.length)return{imp:0,jub:0,os:0,total:0};
  const cat=CATS[ci],eB=c.a==='Venta de Bienes',eD=c.sl==='Relación de dependencia';
  if(eD)return{imp:eB?cat.ib:cat.is,jub:0,os:0,total:eB?cat.tdb:cat.tds};
  return{imp:eB?cat.ib:cat.is,jub:cat.j,os:cat.os,total:eB?cat.tib:cat.tis};
}

function getFiltered(){
  const g=document.getElementById('fg').value;
  const ci=document.getElementById('fc').value;
  const sf=document.getElementById('fs').value;
  const q=document.getElementById('fq').value.toLowerCase();
  return CLIENTS.filter(c=>{
    if(g&&c.g!==g) return false;
    if(q&&!c.n.toLowerCase().includes(q)) return false;
    const arr=ci==='c1'?c.c1:c.c2;
    const miss=ci==='c1'?c.m1:c.m2;
    const tot=arr.reduce((a,b)=>a+b,0);
    const inc=isIncomplete(arr,miss,ci);
    const s=getSem(TOPE_K>0?tot/TOPE_K:0,inc);
    if(sf&&s.k!==sf) return false;
    return true;
  }).map(c=>{
    const arr=document.getElementById('fc').value==='c1'?c.c1:c.c2;
    const miss=document.getElementById('fc').value==='c1'?c.m1:c.m2;
    const tot=arr.reduce((a,b)=>a+b,0);
    const pct=TOPE_K>0?tot/TOPE_K:0;
    const ci=getCi(tot);
    const inc=isIncomplete(arr,miss,document.getElementById('fc').value);
    return{...c,arr,miss,tot,pct,ci,inc,s:getSem(pct,inc)};
  }).sort((a,b)=>{
    if(sc==='n')return sd*a.n.localeCompare(b.n);
    if(sc==='g')return sd*a.g.localeCompare(b.g);
    if(sc==='t')return sd*(a.tot-b.tot);
    if(sc==='p')return sd*(a.pct-b.pct);
    if(sc==='c')return sd*(a.ci-b.ci);
    return 0;
  });
}

function sortBy(col){
  ['n','g','c','t','p'].forEach(k=>{const e=document.getElementById('th'+k);if(e)e.className='';});
  if(sc===col)sd*=-1;else{sc=col;sd=-1;}
  const e=document.getElementById('th'+col);if(e)e.className=sd===-1?'desc':'asc';
  render();
}

function render(){
  const data=getFiltered();
  document.getElementById('st').textContent=data.length;
  document.getElementById('so').textContent=data.filter(d=>d.s.k==='ok').length;
  document.getElementById('sa').textContent=data.filter(d=>d.s.k==='al').length;
  document.getElementById('sr').textContent=data.filter(d=>d.s.k==='ro').length;
  document.getElementById('tcnt').textContent=data.length+' clientes';

  const tbody=document.getElementById('tbody');
  if(!data.length){
    tbody.innerHTML=`<tr><td colspan="7" class="nd2">No hay clientes que coincidan.</td></tr>`;
    document.getElementById('dp').style.display='none';
    return;
  }
  tbody.innerHTML=data.map(d=>{
    const cLbl=CATS.length?CATS[d.ci].c:'—';
    const bc=bcolor(d.s.k);
    const pBar=Math.min(d.pct*100,100).toFixed(0);
    // % label: show % remaining to next cat or to K
    const pctLabel=fmtp(d.pct);
    return`<tr onclick="showD('${d.n.replace(/'/g,"\\'")}')">
      <td>
        <div class="cn">${d.n}</div>
        <div class="mbw">
          <div class="mbb"><div class="mbf" style="width:${pBar}%;background:${bc}"></div></div>
          <span class="mpt">${pctLabel} del tope K</span>
        </div>
      </td>
      <td><span class="bgrp">${d.g}</span></td>
      <td style="text-align:center"><span class="bcat">${cLbl}</span></td>
      <td style="text-align:right"><span class="total-val">$${fmt(d.tot)}</span></td>
      <td style="text-align:right"><span class="pct-val" style="color:${bc}">${pctLabel}</span></td>
      <td><span class="bsem ${d.s.k}">${d.s.l}</span></td>
      <td><button class="vb" onclick="event.stopPropagation();showD('${d.n.replace(/'/g,"\\'")}')">Ver detalle</button></td>
    </tr>`;
  }).join('');
  if(sel)showD(sel);else document.getElementById('dp').style.display='none';
}

function showD(nombre){
  sel=nombre;
  const ciclo=document.getElementById('fc').value;
  const meses=ciclo==='c1'?M1:M2;
  const pastCount=ciclo==='c1'?PAST_C1:PAST_C2;
  const c=CLIENTS.find(x=>x.n===nombre);
  if(!c||!CATS.length) return;
  const arr=ciclo==='c1'?c.c1:c.c2;
  const miss=ciclo==='c1'?c.m1:c.m2;
  const tot=arr.reduce((a,b)=>a+b,0);
  const pct=TOPE_K>0?tot/TOPE_K:0;
  const ci=getCi(tot);
  const cat=CATS[ci];
  const nx=ci<CATS.length-1?CATS[ci+1]:null;
  const inc=isIncomplete(arr,miss,ciclo);
  const s=getSem(pct,inc);
  const bc=bcolor(s.k);
  const maxV=Math.max(...arr,1);
  const fCat=nx?nx.t-tot:0,fMax=TOPE_K-tot,pCat=nx?tot/nx.t:1;
  const cuota=getCuota(c,ci);
  const cuotaNx=nx?getCuota(c,ci+1):null;
  const iibb=getIIBB(c,ci);
  const iibbNx=nx?getIIBB(c,ci+1):null;
  const totalMes=cuota.total+(iibb===null?0:iibb);
  const totalNxMes=cuotaNx?(cuotaNx.total+(iibbNx===null?0:(iibbNx||0))):null;
  const eInd=c.sl==='Independiente';
  const dp=document.getElementById('dp');
  dp.style.display='block';

  // Build month cells
  const monthCells=arr.map((v,i)=>{
    const isPast=i<pastCount;
    const isMiss=miss[i];
    let cls='mc ',label='',valStr='';
    if(isMiss&&isPast){cls+='miss-m';valStr='Pendiente';label='⚠';}
    else if(v===0){cls+='zero-m';valStr='—';}
    else{cls+='ok-m';valStr='$'+fmtk(v);}
    const bw=v>0?Math.round(v/maxV*100):0;
    return`<div class="${cls}">
      <div class="mn2">${meses[i]}</div>
      <div class="mv">${valStr}</div>
      <div class="mb2" style="background:${v>0?bc:'var(--border)'};width:${bw}%"></div>
    </div>`;
  }).join('');

  dp.innerHTML=`
  <div class="dph">
    <div><h2>${c.n}</h2>
      <div class="dpm">
        <span class="bgrp">${c.g}</span>
        <span style="display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;background:var(--gris);color:var(--graffito)">${c.a}</span>
        <span style="display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;background:var(--gris);color:var(--graffito)">${c.sl}</span>
        <span style="display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;background:var(--gris);color:var(--graffito)">${c.iibb}</span>
        <span class="bcat">Cat. ${cat.c}</span>
        <span class="bsem ${s.k}">${s.l}${pct>0?' — '+fmtp(pct)+' del tope K':''}</span>
      </div>
    </div>
    <button class="bcl" onclick="sel=null;document.getElementById('dp').style.display='none'">✕ Cerrar</button>
  </div>
  <div class="dpb">
    <div class="c4">
      <div class="dc dark"><div class="dcl">Facturación ${ciclo==='c1'?'Ene–Dic 2025':'Jul 25–Jun 26'}</div><div class="dcv">$${fmt(tot)}</div><div class="dcs">${ciclo==='c1'?'Ciclo 1':'Ciclo 2'}</div></div>
      <div class="dc"><div class="dcl">Categoría actual</div><div class="dcv">${cat.c}</div><div class="dcs">Tope: $${fmt(cat.t)}</div></div>
      <div class="dc"><div class="dcl">Falta para cat. siguiente</div><div class="dcv" style="font-size:15px;color:${nx&&fCat>0?'var(--marino)':'#C62828'}">${nx?'$'+fmt(fCat):'Tope máx.'}</div><div class="dcs">${nx?'Cat. '+nx.c+' · $'+fmt(nx.t):''}</div></div>
      <div class="dc"><div class="dcl">Falta para tope K</div><div class="dcv" style="font-size:15px;color:${fMax>0?'var(--marino)':'#C62828'}">${fMax>0?'$'+fmt(fMax):'Superado'}</div><div class="dcs">$${fmt(TOPE_K)}</div></div>
    </div>
    <div class="prog"><div class="prgh"><span>% del tope Cat. K</span><strong>${fmtp(pct)}</strong></div><div class="prgt"><div class="prgf" style="width:${Math.min(pct*100,100).toFixed(1)}%;background:${bc}"></div></div></div>
    ${nx?`<div class="prog"><div class="prgh"><span>% del tope cat. siguiente (${nx.c})</span><strong>${fmtp(pCat)}</strong></div><div class="prgt"><div class="prgf" style="width:${Math.min(pCat*100,100).toFixed(1)}%;background:${bc}"></div></div></div>`:''}
    ${inc?`<div style="background:var(--inc-bg);border-left:3px solid #4527A0;padding:8px 12px;border-radius:4px;margin-bottom:10px;font-size:11px;color:var(--inc-txt)">⚠ Hay meses sin completar en este ciclo. Los totales pueden ser incorrectos.</div>`:''}
    <div class="stl">Cuotas mensuales</div>
    <div class="c2">
      <div class="cbox">
        <div class="cbt">Categoría actual — ${cat.c}</div><div class="cbcat">${cat.c}</div>
        <div class="cbl"><span class="cbn">Impuesto integrado</span><span class="cba">$${fmt(cuota.imp)}</span></div>
        ${eInd?`<div class="cbl"><span class="cbn">Jubilación</span><span class="cba">$${fmt(cuota.jub)}</span></div><div class="cbl"><span class="cbn">Obra social</span><span class="cba">$${fmt(cuota.os)}</span></div>`:'<div class="cbl"><span class="cbn">Jubilación y OS</span><span class="cba" style="color:var(--graffito)">Por empleador</span></div>'}
        <div class="cbtot"><span class="cbn">Subtotal monotributo</span><span class="cba">$${fmt(cuota.total)}</span></div>
        <div class="cbiibb"><span class="cbn">IIBB (${c.iibb})</span><span class="cba">${iibb===null?'No aplica':iibb===0?'$0 — Exento':'$'+fmt(iibb)}</span></div>
        <div class="cbgrand"><span class="cbn">TOTAL A PAGAR / MES</span><span class="cba">$${fmt(totalMes)}</span></div>
      </div>
      ${nx?`<div class="cbox nx">
        <div class="cbt">Si sube a cat. ${nx.c}</div><div class="cbcat">${nx.c}</div>
        <div class="cbl"><span class="cbn">Impuesto integrado</span><span class="cba">$${fmt(cuotaNx.imp)}</span></div>
        ${eInd?`<div class="cbl"><span class="cbn">Jubilación</span><span class="cba">$${fmt(cuotaNx.jub)}</span></div><div class="cbl"><span class="cbn">Obra social</span><span class="cba">$${fmt(cuotaNx.os)}</span></div>`:'<div class="cbl"><span class="cbn">Jubilación y OS</span><span class="cba" style="color:var(--graffito)">Por empleador</span></div>'}
        <div class="cbtot"><span class="cbn">Subtotal monotributo</span><span class="cba">$${fmt(cuotaNx.total)}</span></div>
        <div class="cbiibb"><span class="cbn">IIBB</span><span class="cba">${iibbNx===null?'No aplica':iibbNx===0?'$0 — Exento':'$'+fmt(iibbNx)}</span></div>
        <div class="cbgrand"><span class="cbn">TOTAL A PAGAR / MES</span><span class="cba">$${fmt(totalNxMes)}</span></div>
        <div style="margin-top:6px;font-size:10px;color:var(--celeste);font-weight:600;text-align:center">+$${fmt(totalNxMes-totalMes)}/mes adicionales</div>
      </div>`:`<div class="cbox" style="background:#FFF3F3;border-color:#FFCDD2"><div class="cbt">Situación crítica</div><div class="cbcat" style="color:#C62828">K</div><div style="font-size:11px;color:#C62828;margin-top:8px;line-height:1.6">Categoría máxima.<br>Analizar exclusión del régimen.</div></div>`}
    </div>
    <div class="stl">Facturación mes a mes — ${ciclo==='c1'?'Ene–Dic 2025':'Jul 25–Jun 26'}</div>
    <div class="mg">${monthCells}</div>
    <div class="dpacts">
      <button class="bp" onclick="window.print()">Exportar PDF</button>
      <button class="bsec">Exportar Excel</button>
    </div>
  </div>`;
  dp.scrollIntoView({behavior:'smooth',block:'start'});
}

// Init with Ciclo 2 selected by default
onCicloChange();
loadAll();
</script>
